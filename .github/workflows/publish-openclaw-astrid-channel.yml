name: Publish @gracefultools/openclaw-astrid-channel

# Publishes the version written in package.json when npm does not have it yet,
# and does nothing when it does. There is no automatic bump: to release, raise
# the version (and CHANGELOG.md) in the PR. Uses npm trusted publishing (OIDC);
# the trusted publisher at npmjs.com names this file, so do not rename it.

on:
  push:
    branches:
      - main
    paths:
      - 'packages/openclaw-astrid-channel/**'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-26.04
    # Owner-only: a fork's schedule and events run nothing here (ADEV-103).
    if: ${{ github.repository_owner == 'Graceful-Tools' && (!contains(github.event.head_commit.message, '[skip-publish]')) }}
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: packages/openclaw-astrid-channel

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      - name: Is this version already on npm?
        id: version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -n "$(npm view "$NAME@$VERSION" version 2>/dev/null || true)" ]; then
            echo "$NAME@$VERSION is already on npm; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing $NAME@$VERSION"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Use an npm that supports trusted publishing (11.5.1+)
        if: steps.version.outputs.publish == 'true'
        run: |
          CURRENT_NPM=$(npm --version)
          if node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$CURRENT_NPM"; then
            echo "npm $CURRENT_NPM supports trusted publishing"
          else
            npm install -g npm@^11.5.1
          fi

      # The package has no lockfile; OpenClaw is a peer dependency and its types
      # are stubbed in src/openclaw-plugin-sdk.d.ts, so skip installing peers.
      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: npm install --no-package-lock --legacy-peer-deps --no-audit --no-fund

      - name: Build and check the plugin loads as CommonJS
        if: steps.version.outputs.publish == 'true'
        run: |
          npm run build
          node -e "const p = require('./dist/index.js'); if (typeof p.register !== 'function') { console.error('dist/index.js does not export register()'); process.exit(1) }"

      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        run: |
          npm publish --access public || {
            echo "::error::npm publish failed. E403 'OIDC permission denied' means the trusted publisher at npmjs.com does not allow direct 'npm publish' or does not name Graceful-Tools/astrid-web and publish-openclaw-astrid-channel.yml."
            exit 1
          }

      - name: Create GitHub Release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: openclaw-astrid-channel-v${{ steps.version.outputs.version }}
          name: "@gracefultools/openclaw-astrid-channel v${{ steps.version.outputs.version }}"
          body: |
            ## @gracefultools/openclaw-astrid-channel v${{ steps.version.outputs.version }}

            ```bash
            npm install -g @gracefultools/openclaw-astrid-channel@${{ steps.version.outputs.version }}
            ```

            See packages/openclaw-astrid-channel/CHANGELOG.md.
          draft: false
          prerelease: false
