name: 'Copilot Setup Steps'

# The GitHub Copilot coding agent runs this job before it starts work. The job
# name `copilot-setup-steps` is required by GitHub. Secrets come only from the
# `copilot` environment, which holds no production credentials
# (docs/AGENT_FLEET.md → Secrets).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/agent-setup/**

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: astrid_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Agent setup
        uses: ./.github/actions/agent-setup
