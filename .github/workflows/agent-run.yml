name: 'Agent Run'

# One /fixall pass on the web board by a coding agent on an ephemeral runner.
# The harness is an input; everything else — setup, queue, claim, gates, what
# the run produces — is the same for every harness (docs/AGENT_FLEET.md).
#
# The GitHub Copilot coding agent does not come through here: GitHub runs it
# itself, using copilot-setup-steps.yml, which calls the same setup action.
#
# What this job can NOT do, on purpose:
#   - read production credentials: it declares the `agent` environment, never
#     `production`, so the database secrets are not released to it;
#   - deploy: it has no `actions: write`, so it cannot dispatch
#     production-deployment.yml. The run ends at a pushed branch, an open PR and
#     a comment on the task. Merging and deploying are the ship workflow's job
#     (docs/AGENT_FLEET.md → Shipping).
#
# Scheduled since 2026-10-28 (AWTD-1363 step 1): Claude works the web board from
# here, per Jon's 2026-10-24 decision (AWTD-1361), after smoke test 3 (AWTD-1403)
# opened its own PR and got CI unaided. :05/:35 stays clear of the Mac loop's
# :20/:50 until that loop is retired; claims are atomic either way. A scheduled
# run has no inputs, so the harness defaults to claude-code below.
on:
  schedule:
    - cron: '5,35 * * * *'
  # The chain job's "start the next run" (below). Its payload carries the depth.
  repository_dispatch:
    types: [agent-run-next]
  workflow_dispatch:
    inputs:
      harness:
        description: 'Which coding agent runs the pass'
        required: true
        default: 'claude-code'
        type: choice
        options:
          - claude-code
          - codex
      dry_run:
        description: 'List the queue without working it'
        required: false
        default: false
        type: boolean

concurrency:
  group: agent-run-${{ (inputs.harness || 'claude-code') }}
  cancel-in-progress: false

# Per job: the run job's writes must not reach the chain job (zizmor).
permissions: {}

jobs:
  run:
    name: "Agent run (${{ (inputs.harness || 'claude-code') }})"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: read
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    environment: agent
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: astrid_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      ASTRID_OAUTH_CLIENT_ID: ${{ secrets.ASTRID_OAUTH_CLIENT_ID }}
      ASTRID_OAUTH_CLIENT_SECRET: ${{ secrets.ASTRID_OAUTH_CLIENT_SECRET }}
      ASTRID_FIXALL_HARNESS: ${{ (inputs.harness || 'claude-code') }}
      ASTRID_OAUTH_LIST_ID: ${{ vars.ASTRID_WEB_LIST_ID || 'a623f322-4c3c-49b5-8a94-d2d9f00c82ba' }}
      # The job's own disposable Postgres (services.postgres), the same wiring as
      # e2e-tests.yml's authenticated-critical job. Agents reach it through npm
      # scripts; the run never holds a production or staging database URL.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/astrid_test
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@localhost:5432/astrid_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/astrid_test
      NEXTAUTH_SECRET: test-secret-at-least-32-characters-long-for-ci
      NEXTAUTH_URL: http://localhost:3000
      NEXT_AUTH_PUBLIC_URL: http://localhost:3000
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      ASTRID_FIXALL_CLAIMS_FILE: ${{ github.workspace }}/.agent-output/claims.txt
      # docs/FIXALL_WORKFLOW.md → On an ephemeral runner: the checkout is this
      # job's alone (no lock), production is out of reach (prod questions are
      # handbacks), and the run stops at the PR.
      ASTRID_FIXALL_EPHEMERAL: '1'
      ASTRID_FIXALL_MAX_TASKS: ${{ vars.ASTRID_FIXALL_MAX_TASKS || '1' }}
      # PRs opened with the built-in token do not trigger other workflows (GitHub's
      # loop guard), so an agent PR would get no CI. AGENT_GH_TOKEN is a
      # fine-grained token scoped to this repo with contents + pull-requests write
      # and NO actions write, so it still cannot dispatch a deploy. Smoke test
      # AWTD-1364 / PR #518 had no checks until a person reopened it.
      GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # git push uses this, so the agent's branch push triggers CI too.
          token: ${{ secrets.AGENT_GH_TOKEN || github.token }}

      - name: Agent setup
        uses: ./.github/actions/agent-setup

      - name: Identify the run in git
        run: |
          mkdir -p .agent-output .agent-state
          touch "${ASTRID_FIXALL_CLAIMS_FILE}"
          git config user.name "Astrid agent (${ASTRID_FIXALL_HARNESS})"
          git config user.email "agent-${ASTRID_FIXALL_HARNESS}@users.noreply.github.com"

      - name: Restore durable wake state
        id: wake-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .agent-state
          key: agent-wake-v1-${{ (inputs.harness || 'claude-code') }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: agent-wake-v1-${{ (inputs.harness || 'claude-code') }}-${{ github.ref_name }}-

      - name: Restore retained state when the cache was evicted
        if: ${{ steps.wake-cache.outputs.cache-matched-key == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx tsx scripts/restore-cloud-wake-state.ts

      - name: Queue and inbox preflight
        id: preflight
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          AGENT=$(node -e 'const m={"claude-code":"claude","codex":"codex"}; const a=m[process.env.ASTRID_FIXALL_HARNESS]; if(!a) process.exit(1); process.stdout.write(a)')
          echo "agent=${AGENT}" >> "${GITHUB_OUTPUT}"
          if [ "${DRY_RUN}" != "true" ]; then
            if [ -z "${GH_TOKEN}" ]; then
              echo "::error::AGENT_GH_TOKEN is required so branch pushes and PRs receive CI"
              exit 1
            fi
            npx tsx scripts/agent-queue-status.ts --agent "${AGENT}" --list "${ASTRID_OAUTH_LIST_ID}" \
              --require-polling --dry-run --no-write-seen && STATUS=0 || STATUS=$?
            if [ "${STATUS}" != 0 ] && [ "${STATUS}" != 3 ]; then exit "${STATUS}"; fi
            npx tsx scripts/release-stuck-doing.ts --agent "${AGENT}" \
              --list "${ASTRID_OAUTH_LIST_ID}" --stale-minutes 180
          fi
          FLAGS=()
          if [ "${DRY_RUN}" = "true" ]; then FLAGS+=(--dry-run); fi
          # Check mode BEFORE either a claim or a lane mutation; a polling worker
          # must not race the server's api/webhook dispatcher.
          npx tsx scripts/agent-queue-status.ts --agent "${AGENT}" \
            --board web --list "${ASTRID_OAUTH_LIST_ID}" --include-unassigned \
            --require-polling --no-write-seen --seen .agent-state/seen.json \
            --output .agent-output/preflight.json "${FLAGS[@]}" && STATUS=0 || STATUS=$?
          if [ "${STATUS}" != 0 ] && [ "${STATUS}" != 3 ]; then exit "${STATUS}"; fi
          node -e '
            const fs=require("fs"), p=JSON.parse(fs.readFileSync(".agent-output/preflight.json"));
            if(p.version!==1 || typeof p.work!=="boolean" || !Array.isArray(p.wakeKeys)) process.exit(1);
            fs.writeFileSync(".agent-output/wake-keys.json",JSON.stringify(p.wakeKeys));
            fs.appendFileSync(process.env.GITHUB_OUTPUT,`work=${p.work}\n`);
          '

      - name: Build and verify Astrid MCP
        if: ${{ !inputs.dry_run && steps.preflight.outputs.work == 'true' }}
        run: |
          npm run build:mcp:oauth
          node --input-type=module -e '
            import {Client} from "@modelcontextprotocol/sdk/client/index.js";
            import {StdioClientTransport} from "@modelcontextprotocol/sdk/client/stdio.js";
            const client=new Client({name:"agent-preflight",version:"1"});
            const transport=new StdioClientTransport({command:"node",args:["mcp/astrid-mcp-launch.js"],env:process.env});
            try {
              await client.connect(transport);
              const {tools}=await client.listTools();
              for(const name of ["get_agent_queue","get_task","get_task_comments","add_comment","update_task"])
                if(!tools.some(t=>t.name===name)) throw new Error(`Missing MCP tool ${name}`);
            } finally { await client.close(); }
          '
          node -e '
            const fs=require("fs");
            const server={command:"node",args:[process.cwd()+"/mcp/astrid-mcp-launch.js"]};
            fs.writeFileSync(process.env.RUNNER_TEMP+"/astrid-mcp.json",JSON.stringify({mcpServers:{astrid:server}}));
          '

      # Signed-in e2e work needs a browser before the agent starts: the agent's
      # sandbox allows npm scripts, not `npx playwright install` (AWTD-1405 was
      # handed back for exactly that). Agent setup has already migrated the
      # database; migrating it again here failed with P3005 (AWTD-1410).
      - name: Install Chromium for e2e
        if: ${{ !inputs.dry_run && steps.preflight.outputs.work == 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Run Claude Code
        id: claude
        timeout-minutes: 75
        if: ${{ !inputs.dry_run && steps.preflight.outputs.work == 'true' && (inputs.harness || 'claude-code') == 'claude-code' }}
        env:
          # Subscription token from `claude setup-token` — never an API key
          # (Jon, 2026-09-19: the loops run on the subscription).
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -o pipefail
          npm install --global @anthropic-ai/claude-code@2.1.306
          claude -p "$(cat .github/agent-run-prompt.md)" \
            --mcp-config "${RUNNER_TEMP}/astrid-mcp.json" --strict-mcp-config \
            --permission-mode acceptEdits \
            --allowedTools "Bash(npm run *),Bash(npx tsx scripts/*),Bash(npx vitest *),Bash(git *),Bash(gh pr *),mcp__astrid__*,Read,Edit,Write,Grep,Glob" \
            | tee .agent-output/agent-transcript.txt

      - name: Run Codex
        id: codex
        timeout-minutes: 75
        if: ${{ !inputs.dry_run && steps.preflight.outputs.work == 'true' && (inputs.harness || 'claude-code') == 'codex' }}
        env:
          CODEX_VERSION: ${{ vars.CODEX_VERSION }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          # Unverified: set the CODEX_VERSION variable and the CODEX_AUTH_JSON
          # secret (a ChatGPT-plan login) before the first codex run.
          if [ -z "${CODEX_VERSION}" ] || [ -z "${CODEX_AUTH_JSON}" ]; then
            echo "::error::codex harness is not configured (CODEX_VERSION / CODEX_AUTH_JSON)"
            exit 1
          fi
          set -o pipefail
          npm install --global "@openai/codex@${CODEX_VERSION}"
          mkdir -p ~/.codex && printf '%s' "${CODEX_AUTH_JSON}" > ~/.codex/auth.json
          codex -c 'mcp_servers.astrid.command="node"' \
            -c "mcp_servers.astrid.args=[\"${GITHUB_WORKSPACE}/mcp/astrid-mcp-launch.js\"]" \
            -c sandbox_workspace_write.network_access=true \
            exec --full-auto "$(cat .github/agent-run-prompt.md)" | tee .agent-output/agent-transcript.txt

      # The harness exits 0 whether or not the agent finished. Smoke test 2
      # (AWTD-1366) could not open its PR, said RESULT: PARTIAL, and went green,
      # so a broken loop looked like a working one. The agent's own last RESULT
      # line is the verdict; cleanup steps below still run on always().
      - name: Fail the run unless the agent reports OK or SKIPPED
        id: verdict
        if: ${{ !inputs.dry_run && steps.preflight.outputs.work == 'true' }}
        run: |
          RESULT=$(grep -E '^RESULT: ' .agent-output/agent-transcript.txt 2>/dev/null | tail -1 || true)
          echo "${RESULT:-no RESULT line}"
          # OK or SKIPPED as a whole word, alone or followed by a note. Not
          # "RESULT: OKAY", and not the prompt's own format line
          # "RESULT: OK | SKIPPED | …" echoed back (AWTD-1424).
          if ! printf '%s\n' "${RESULT}" | grep -qE '^RESULT: (OK|SKIPPED)($| +[^| ])'; then
            echo "::error::The agent did not finish: ${RESULT:-it printed no RESULT line}"
            exit 1
          fi
          echo "result=$(printf '%s\n' "${RESULT}" | sed -E 's/^RESULT: (OK|SKIPPED).*/\1/')" >> "${GITHUB_OUTPUT}"

      - name: Preserve unfinished work
        if: ${{ always() && !inputs.dry_run && steps.preflight.outputs.work == 'true' }}
        run: |
          DIRTY=$(git status --porcelain)
          UNPUSHED=$(git rev-list --count HEAD --not --remotes=origin)
          if [ -n "${DIRTY}" ] || [ "${UNPUSHED}" != 0 ]; then
            BRANCH=$(git branch --show-current)
            if [ "${BRANCH}" = main ] || [ -z "${BRANCH}" ]; then
              git switch -c "agent/${ASTRID_FIXALL_HARNESS}/recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            fi
            if [ -n "${DIRTY}" ]; then
              git add --all
              git commit -m "wip: agent run ${GITHUB_RUN_ID} UNFINISHED, UNVERIFIED"
            fi
            mkdir -p .agent-output
            git bundle create .agent-output/recovery.bundle HEAD --not --remotes=origin
            git rev-parse HEAD > .agent-output/recovery-head.txt
            git push --set-upstream origin HEAD
          fi

      - name: Register finished cloud handoffs
        if: ${{ always() && !inputs.dry_run && steps.preflight.outputs.work == 'true' }}
        env:
          AGENT: ${{ steps.preflight.outputs.agent }}
        run: |
          npx tsx scripts/open-fixall-prs.ts --claims-file "${ASTRID_FIXALL_CLAIMS_FILE}" \
            --repo "${GITHUB_WORKSPACE}" --cloud-agent "${AGENT}" --list "${ASTRID_OAUTH_LIST_ID}"

      - name: Release unfinished claims
        if: ${{ always() && !inputs.dry_run && steps.preflight.outputs.agent != '' }}
        env:
          AGENT: ${{ steps.preflight.outputs.agent }}
        run: |
          npx tsx scripts/release-stuck-doing.ts --agent "${AGENT}" \
            --claims-file "${ASTRID_FIXALL_CLAIMS_FILE}"

      - name: Record wake outcome
        if: ${{ always() && !inputs.dry_run && steps.preflight.outputs.work == 'true' }}
        env:
          AGENT: ${{ steps.preflight.outputs.agent }}
          RUN_OK: ${{ job.status == 'success' }}
        run: |
          FLAGS=()
          if [ "${RUN_OK}" != true ]; then FLAGS+=(--failed); fi
          npx tsx scripts/agent-queue-status.ts --agent "${AGENT}" --list "${ASTRID_OAUTH_LIST_ID}" \
            --seen .agent-state/seen.json --mark-seen --seen-keys-file .agent-output/wake-keys.json "${FLAGS[@]}"

      - name: Persist durable wake state
        if: ${{ always() && !inputs.dry_run && steps.preflight.outputs.work == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .agent-state
          key: agent-wake-v1-${{ (inputs.harness || 'claude-code') }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Persist run outputs and recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agent-run-${{ (inputs.harness || 'claude-code') }}-${{ github.run_id }}
          path: |
            .agent-output/
            .agent-state/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  # GitHub creates scheduled runs when it can, not when asked: from 10-29 to
  # 10-31 it created 10 of the ~100 runs ':05,35' asks for, so the queue drained
  # one task every four or five hours. A run that finished a task starts the
  # next one; a run that finds nothing (SKIPPED), fails, or reaches the depth cap
  # ends the chain, and the schedule stays as the fallback. Shipping is started
  # by the agent PR's CI finishing (agent-ship.yml).
  #
  # It starts the next run with a repository_dispatch, which needs only the
  # Contents write AGENT_GH_TOKEN already has. A workflow_dispatch would need
  # actions: write, and with that the job could dispatch a production deploy.
  # Only the default harness chains: a repository_dispatch carries no inputs.
  chain:
    name: Start the next run
    needs: run
    if: ${{ !inputs.dry_run && (inputs.harness || 'claude-code') == 'claude-code' && needs.run.result == 'success' && needs.run.outputs.result == 'OK' }}
    runs-on: ubuntu-24.04
    # AGENT_GH_TOKEN is an `agent` environment secret; without this it reads empty.
    environment: agent
    timeout-minutes: 5
    permissions: {}
    env:
      GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
      GH_REPO: ${{ github.repository }}
      DEPTH: ${{ github.event.client_payload.chain_depth || '0' }}
      MAX_CHAIN: ${{ vars.ASTRID_AGENT_MAX_CHAIN || '8' }}
    steps:
      - name: Start the next run unless the chain is at its cap
        run: |
          if [ "${DEPTH}" -ge "${MAX_CHAIN}" ]; then
            echo "Chain depth ${DEPTH} reached ASTRID_AGENT_MAX_CHAIN=${MAX_CHAIN}; the schedule takes over"
            exit 0
          fi
          gh api "repos/${GH_REPO}/dispatches" -f event_type=agent-run-next -F "client_payload[chain_depth]=$((DEPTH + 1))"
          echo "Started run $((DEPTH + 1)) of at most ${MAX_CHAIN}"
