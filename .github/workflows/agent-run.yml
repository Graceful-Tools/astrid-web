name: 'Agent Run'

# One /fixall pass on the web board by a coding agent on an ephemeral runner.
# The harness is an input; everything else — setup, queue, claim, gates, what
# the run produces — is the same for every harness (docs/AGENT_FLEET.md).
#
# The GitHub Copilot coding agent does not come through here: GitHub runs it
# itself, using copilot-setup-steps.yml, which calls the same setup action.
#
# What this job can NOT do, on purpose:
#   - read production credentials: it declares the `agent` environment, never
#     `production`, so the database secrets are not released to it;
#   - deploy: it has no `actions: write`, so it cannot dispatch
#     production-deployment.yml. The run ends at a pushed branch, an open PR and
#     a comment on the task. Merging and deploying are the ship workflow's job
#     (docs/AGENT_FLEET.md → Shipping).
#
# Scheduled since 2026-10-28 (AWTD-1363 step 1): Claude works the web board from
# here, per Jon's 2026-10-24 decision (AWTD-1361), after smoke test 3 (AWTD-1403)
# opened its own PR and got CI unaided. :05/:35 stays clear of the Mac loop's
# :20/:50 until that loop is retired; claims are atomic either way. A scheduled
# run has no inputs, so the harness defaults to claude-code below.
#
# PARALLEL WORKERS (ADEV-26). A run is N workers, N = repo variable
# ASTRID_AGENT_WORKERS (default 3, clamped to 1..10): a matrix over worker slots
# in the run job, each slot its own runner with its own checkout, Postgres,
# claims file and artifact. Local sessions keep working the same board at the
# same time; atomic claims are what make that safe, and every worker takes a
# DIFFERENT task (scripts/claim-next-fixall-task.ts: a 409 moves it on to the
# next Ready task). Only slot 1 answers the attention inbox, runs the stale-Doing
# sweep and keeps wake state, so N workers never answer one comment N times or
# release one task twice (a second release is a handback). docs/FIXALL_WEB.md →
# Parallel workers.
on:
  schedule:
    - cron: '5,35 * * * *'
  # agent-run-next: the chain job's "start the next run" (below); its payload
  # carries the depth. astrid-wake: the server's opt-in event wake (AWTD-1556,
  # lib/agent-wake.ts) when a task enters Ready or a person replies to an agent
  # on an enrolled board. Its payload is a hint (task_id, mailbox, reason,
  # event_at): the run reads the queue and claims exactly as a cron run does,
  # so a stale, duplicate or forged wake starts a run that finds nothing.
  repository_dispatch:
    types: [agent-run-next, astrid-wake]
  workflow_dispatch:
    inputs:
      harness:
        description: 'Which coding agent runs the pass'
        required: true
        default: 'claude-code'
        type: choice
        options:
          - claude-code
          - codex
      dry_run:
        description: 'List the queue without working it'
        required: false
        default: false
        type: boolean
      use_runner:
        description: 'Slots 2..N claim and run through astrid-agent run --fixall (ADEV-86); off keeps the shell claim'
        required: false
        default: false
        type: boolean
      task_id:
        description: 'With use_runner: a task uuid (any status, e.g. Inbox). Slot 2 moves it to Ready and claims it at once; other slots stand down (ADEV-88)'
        required: false
        default: ''
        type: string

# No workflow-level concurrency group (ADEV-26). There used to be one,
# agent-run-<harness>, which made the whole loop ONE worker: a run held the
# group for its full length, and since GitHub keeps only ONE pending run per
# concurrency group, a wake or cron tick that arrived while one run worked and
# another already waited was cancelled (three on 2026-11-15/16). The groups are
# now per worker slot, on the run job below. GitHub still keeps one pending job
# per group, so a new run's slot-k worker waits only for the previous run's slot
# k, and starts the moment that slot frees. A pending worker is replaced by a
# newer one only while its slot is busy, and the newer run reads the same live
# queue, so a wake is never lost while any slot has capacity.

# Per job: the run job's writes must not reach the chain job (zizmor).
permissions: {}

jobs:
  # How many workers, as a matrix the run job can expand. A job of its own
  # because a matrix cannot be computed from an expression, and it holds no
  # token and no secret. A dry run is one worker.
  plan:
    name: Plan the workers
    # A wake for another harness's mailbox is not this worker's: skip it rather
    # than spend a runner reading a queue that is not ours. `any` is an
    # unassigned Ready task, which any loop may claim. The run job needs this
    # one, so a skip here skips the workers too.
    # Owner-only: a fork's schedule and events run nothing here (ADEV-103).
    if: ${{ github.repository_owner == 'Graceful-Tools' && (github.event.action != 'astrid-wake' || contains(fromJSON('["claude","any"]'), github.event.client_payload.mailbox)) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      slots: ${{ steps.slots.outputs.slots }}
    steps:
      - name: Turn ASTRID_AGENT_WORKERS into worker slots
        id: slots
        env:
          WORKERS: ${{ vars.ASTRID_AGENT_WORKERS || '3' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          N="${WORKERS}"
          if ! [[ "${N}" =~ ^[0-9]+$ ]] || [ "${N}" -lt 1 ]; then
            echo "::warning::ASTRID_AGENT_WORKERS=${WORKERS} is not a whole number of at least 1; running one worker"
            N=1
          fi
          # Ten is a ceiling on runner minutes and subscription concurrency, not
          # on the board: raise it here deliberately if ten is ever too few.
          if [ "${N}" -gt 10 ]; then
            echo "::warning::ASTRID_AGENT_WORKERS=${WORKERS} is above the ceiling of 10; running 10"
            N=10
          fi
          if [ "${DRY_RUN}" = true ]; then N=1; fi
          echo "slots=[$(seq 1 "${N}" | paste -sd, -)]" >> "${GITHUB_OUTPUT}"
          echo "${N} worker slot(s)"

  run:
    # Owner-only: a fork's schedule and events run nothing here (ADEV-103).
    if: github.repository_owner == 'Graceful-Tools'
    name: "Agent run (${{ (inputs.harness || 'claude-code') }}, slot ${{ matrix.slot }})"
    needs: plan
    # A matrix, not N workflows or N concurrency groups chosen at random: one
    # run per wake keeps the event → run → chain story readable, and the slot
    # number is what keys each worker's concurrency group, claims file and
    # artifact. fail-fast is off, so one worker's red verdict never cancels a
    # sibling that is mid-task.
    strategy:
      fail-fast: false
      matrix:
        slot: ${{ fromJSON(needs.plan.outputs.slots) }}
    # One group per slot (see the note above `permissions`).
    concurrency:
      group: agent-run-${{ (inputs.harness || 'claude-code') }}-slot-${{ matrix.slot }}
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
      actions: read
    # No job outputs: a matrix job's outputs are last-writer-wins, so one
    # SKIPPED worker finishing after an OK one would read as "nothing done".
    # Each worker uploads its own verdict artifact for the chain job instead.
    environment: agent
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: astrid_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      ASTRID_OAUTH_CLIENT_ID: ${{ secrets.ASTRID_OAUTH_CLIENT_ID }}
      ASTRID_OAUTH_CLIENT_SECRET: ${{ secrets.ASTRID_OAUTH_CLIENT_SECRET }}
      ASTRID_FIXALL_HARNESS: ${{ (inputs.harness || 'claude-code') }}
      ASTRID_OAUTH_LIST_ID: ${{ vars.ASTRID_WEB_LIST_ID || 'a623f322-4c3c-49b5-8a94-d2d9f00c82ba' }}
      # The job's own disposable Postgres (services.postgres), the same wiring as
      # e2e-tests.yml's authenticated-critical job. Agents reach it through npm
      # scripts; the run never holds a production or staging database URL.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/astrid_test
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@localhost:5432/astrid_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/astrid_test
      NEXTAUTH_SECRET: test-secret-at-least-32-characters-long-for-ci
      NEXTAUTH_URL: http://localhost:3000
      NEXT_AUTH_PUBLIC_URL: http://localhost:3000
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      # Each slot is its own runner, so nothing on disk is shared; the slot is in
      # the name anyway, so artifacts read side by side cannot be confused.
      ASTRID_AGENT_SLOT: ${{ matrix.slot }}
      ASTRID_FIXALL_CLAIMS_FILE: ${{ github.workspace }}/.agent-output/claims-slot-${{ matrix.slot }}.txt
      # docs/FIXALL_WORKFLOW.md → On an ephemeral runner: the checkout is this
      # job's alone (no lock), production is out of reach (prod questions are
      # handbacks), and the run stops at the PR.
      ASTRID_FIXALL_EPHEMERAL: '1'
      ASTRID_FIXALL_MAX_TASKS: ${{ vars.ASTRID_FIXALL_MAX_TASKS || '1' }}
      # PRs opened with the built-in token do not trigger other workflows (GitHub's
      # loop guard), so an agent PR would get no CI. AGENT_GH_TOKEN is a
      # fine-grained token over the Graceful-Tools app repos, astrid-core included
      # (AWTD-1682), with contents + pull-requests read/write and NO actions access,
      # so it still cannot dispatch a deploy. Smoke test AWTD-1364 / PR #518 had no checks until a
      # person reopened it.
      GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
      # ADEV-339: `npm run deps:add` asks Socket about every package it would install and
      # refuses without these. `agent` environment secrets; unset means no installs.
      SOCKET_API_TOKEN: ${{ secrets.SOCKET_API_TOKEN }}
      SOCKET_ORG_SLUG: ${{ secrets.SOCKET_ORG_SLUG }}
      # Core work belongs to the web and iOS loops (FIXALL_WORKFLOW.md → astrid-core is
      # worked by web and iOS). It is cloned beside this checkout, at ../astrid-core.
      ASTRID_CORE_REPO: Graceful-Tools/astrid-core
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # git push uses this, so the agent's branch push triggers CI too.
          token: ${{ secrets.AGENT_GH_TOKEN || github.token }}

      - name: Agent setup
        uses: ./.github/actions/agent-setup

      - name: Identify the run in git
        run: |
          mkdir -p .agent-output .agent-state
          touch "${ASTRID_FIXALL_CLAIMS_FILE}"
          # The email is on astrid.cc, a domain we own, on purpose. GitHub credits a commit to
          # the account that VERIFIED its email, except `<login>@users.noreply.github.com`,
          # which it credits to whoever holds <login>. `agent-claude-code` was registered by a
          # stranger four days after these commits went public (2026-10-29), so 139 agent
          # commits listed them as a contributor. Never use a bare-login noreply address here.
          git config user.name "Astrid agent (${ASTRID_FIXALL_HARNESS})"
          git config user.email "agent-${ASTRID_FIXALL_HARNESS}@astrid.cc"

      # Wake state is slot 1's alone: only slot 1 answers the inbox, so only it
      # has wake keys to record, and one writer keeps the cache key unique.
      - name: Restore durable wake state
        id: wake-cache
        if: ${{ matrix.slot == 1 }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .agent-state
          key: agent-wake-v1-${{ (inputs.harness || 'claude-code') }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: agent-wake-v1-${{ (inputs.harness || 'claude-code') }}-${{ github.ref_name }}-

      - name: Restore retained state when the cache was evicted
        if: ${{ matrix.slot == 1 && steps.wake-cache.outputs.cache-matched-key == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx tsx scripts/restore-cloud-wake-state.ts

      - name: Queue and inbox preflight
        id: preflight
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          PINNED_TASK: ${{ inputs.use_runner && inputs.task_id || '' }}
        run: |
          if [ -n "${PINNED_TASK}" ] && ! [[ "${PINNED_TASK}" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::task_id must be a task uuid (the status script and the claim route both take one)"
            exit 1
          fi
          AGENT=$(node -e 'const m={"claude-code":"claude","codex":"codex"}; const a=m[process.env.ASTRID_FIXALL_HARNESS]; if(!a) process.exit(1); process.stdout.write(a)')
          echo "agent=${AGENT}" >> "${GITHUB_OUTPUT}"
          if [ "${DRY_RUN}" != "true" ]; then
            if [ -z "${GH_TOKEN}" ]; then
              echo "::error::AGENT_GH_TOKEN is required so branch pushes and PRs receive CI"
              exit 1
            fi
            npx tsx scripts/agent-queue-status.ts --agent "${AGENT}" --list "${ASTRID_OAUTH_LIST_ID}" \
              --require-polling --dry-run --no-write-seen && STATUS=0 || STATUS=$?
            if [ "${STATUS}" != 0 ] && [ "${STATUS}" != 3 ]; then exit "${STATUS}"; fi
            # Slot 1 only (ADEV-26): N workers sweeping at once could each release
            # the same stale task, and a second release marker hands it back.
            if [ "${ASTRID_AGENT_SLOT}" = 1 ]; then
              npx tsx scripts/release-stuck-doing.ts --agent "${AGENT}" \
                --list "${ASTRID_OAUTH_LIST_ID}" --stale-minutes 180
            fi
          fi
          FLAGS=()
          if [ "${DRY_RUN}" = "true" ]; then FLAGS+=(--dry-run); fi
          # Check mode BEFORE either a claim or a lane mutation; a polling worker
          # must not race the server's api/webhook dispatcher.
          npx tsx scripts/agent-queue-status.ts --agent "${AGENT}" \
            --board web --list "${ASTRID_OAUTH_LIST_ID}" --include-unassigned \
            --require-polling --no-write-seen --seen .agent-state/seen.json \
            --output .agent-output/preflight.json "${FLAGS[@]}" && STATUS=0 || STATUS=$?
          if [ "${STATUS}" != 0 ] && [ "${STATUS}" != 3 ]; then exit "${STATUS}"; fi
          # Slot 1 works on the full verdict: Ready work or an unanswered inbox item.
          # Every other slot works only Ready tasks, and only while the queue holds
          # one; it never answers the inbox, so it carries no wake keys to mark.
          node -e '
            const fs=require("fs"), p=JSON.parse(fs.readFileSync(".agent-output/preflight.json"));
            if(p.version!==1 || typeof p.work!=="boolean" || !Array.isArray(p.wakeKeys)) process.exit(1);
            const slot=Number(process.env.ASTRID_AGENT_SLOT||"1");
            const queued=Array.isArray(p.snapshot&&p.snapshot.queue)?p.snapshot.queue.length:0;
            // ADEV-88: a pinned task_id belongs to slot 2 alone; the other slots stand down.
            const pinned=process.env.PINNED_TASK||"";
            const work=pinned ? slot===2 : slot===1 ? p.work : queued>0;
            fs.writeFileSync(".agent-output/wake-keys.json",JSON.stringify(slot===1 ? p.wakeKeys : []));
            fs.appendFileSync(process.env.GITHUB_OUTPUT,`work=${work}\n`);
            console.log(`Slot ${slot}: ${queued} Ready task(s) queued, work=${work}`);
          '

      # Wake latency (AWTD-1556): from the event on the board to this run's
      # queue read. docs/architecture/AGENT_EVENT_WAKE.md → Measurement.
      - name: Record wake latency
        if: ${{ github.event.action == 'astrid-wake' }}
        env:
          EVENT_AT: ${{ github.event.client_payload.event_at }}
          WAKE_REASON: ${{ github.event.client_payload.reason }}
          WAKE_MAILBOX: ${{ github.event.client_payload.mailbox }}
          WORK: ${{ steps.preflight.outputs.work }}
        run: |
          node -e '
            const fs=require("fs"), at=Date.parse(process.env.EVENT_AT||"");
            const row={event_at:process.env.EVENT_AT||null, queue_read_at:new Date().toISOString(),
              latency_seconds:Number.isFinite(at)?Math.round((Date.now()-at)/1000):null,
              reason:process.env.WAKE_REASON||null, mailbox:process.env.WAKE_MAILBOX||null, work:process.env.WORK==="true"};
            fs.mkdirSync(".agent-output",{recursive:true});
            fs.writeFileSync(".agent-output/wake-latency.json",JSON.stringify(row)+"\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY||"/dev/null",
              `Wake latency: ${row.latency_seconds ?? "unknown"}s (${row.reason}, ${row.mailbox}, work=${row.work})\n`);
          '

      # AWTD-1682: the Rust toolchain costs a minute or two, so it is installed only when
      # this run may take a core task. The claim happens inside the harness, so the
      # question is asked of the candidates: any queue or attention task titled `[core]`
      # or naming astrid-core. A run that guessed wrong still has the clone, and cargo
      # installs rust-toolchain.toml's channel on first use; only the wasm target is missing.
      - name: Does the queue hold an astrid-core task
        id: core-queue
        if: ${{ !inputs.dry_run && steps.preflight.outputs.work == 'true' }}
        run: |
          node -e '
            const fs=require("fs"), p=JSON.parse(fs.readFileSync(".agent-output/preflight.json")).snapshot||{};
            const tasks=[...(p.queue||[]), ...((p.attention&&p.attention.tasks)||[])];
            const core=tasks.some(t=>/^\s*\[core\]/i.test(t.title||"") || /\bastrid-core\b/i.test(t.title||""));
            fs.appendFileSync(process.env.GITHUB_OUTPUT,`core=${core}\n`);
            console.log(core ? "A core task is a candidate: installing the Rust toolchain" : "No core task among the candidates");
          '

      # actions/checkout cannot write outside the workspace, and a checkout moved out of
      # it loses the credentials it keyed to its path, so this is a plain clone. The repo
      # is public, so the clone needs no token; pushes go through `gh auth git-credential`,
      # which reads GH_TOKEN (AGENT_GH_TOKEN) when git asks. The dry-run push is the access
      # check: GitHub refuses the push handshake to a token without Contents write.
      - name: Check out astrid-core beside this repo
        if: ${{ !inputs.dry_run && steps.preflight.outputs.work == 'true' }}
        env:
          CORE_TASK: ${{ steps.core-queue.outputs.core }}
        run: |
          CORE_DIR="$(dirname "${GITHUB_WORKSPACE}")/astrid-core"
          if ! git clone --quiet "https://github.com/${ASTRID_CORE_REPO}.git" "${CORE_DIR}"; then
            echo "::error::Could not clone ${ASTRID_CORE_REPO} into ${CORE_DIR}"
            exit 1
          fi
          git -C "${CORE_DIR}" config user.name "Astrid agent (${ASTRID_FIXALL_HARNESS})"
          git -C "${CORE_DIR}" config user.email "agent-${ASTRID_FIXALL_HARNESS}@astrid.cc"   # see "Identify the run in git"
          git -C "${CORE_DIR}" config credential.https://github.com.helper ''
          git -C "${CORE_DIR}" config --add credential.https://github.com.helper '!gh auth git-credential'
          echo "ASTRID_CORE_DIR=${CORE_DIR}" >> "${GITHUB_ENV}"
          if GIT_TERMINAL_PROMPT=0 git -C "${CORE_DIR}" push --dry-run --quiet origin \
              "HEAD:refs/heads/agent/access-check-${GITHUB_RUN_ID}" 2>/dev/null; then
            echo "ASTRID_CORE_PUSH=1" >> "${GITHUB_ENV}"
            echo "AGENT_GH_TOKEN can push to ${ASTRID_CORE_REPO}"
          else
            echo "ASTRID_CORE_PUSH=0" >> "${GITHUB_ENV}"
            MESSAGE="AGENT_GH_TOKEN cannot push to ${ASTRID_CORE_REPO}: add ${ASTRID_CORE_REPO} to the token's repository access with Contents and Pull requests read/write (no Actions). docs/AGENT_FLEET.md"
            # A web-only run is unaffected, so it goes on; a run whose candidates include
            # a core task could not finish it, so it stops here, saying why.
            if [ "${CORE_TASK}" = true ]; then echo "::error::${MESSAGE}"; exit 1; fi
            echo "::warning::${MESSAGE}"
          fi

      # ADEV-26. Slots 2..N claim here, before the costly steps below, so a worker
      # that finds every Ready task taken stops in seconds rather than after a
      # browser install and a session. claim-next walks the queue in priority
      # order and a 409 moves it on to the next task, so N workers starting from
      # one snapshot take N different tasks; it re-reads the live queue before
      # answering "none" (exit 3). It skips core tasks when ASTRID_CORE_PUSH=0.
      # Slot 1 claims inside the session, because it alone may answer the inbox
      # or take a resume instead; the prompt sends it through the same script.
      # ADEV-236: one tiny request proves the Claude Code token works BEFORE any claim. On
      # 2026-11-22 the token was revoked: every worker claimed a task, failed within seconds and
      # released it, and two releases handed a task back to Jon as "failed twice". Now a refused
      # token claims nothing, turns the run red, and slot 1 files one Inbox task for the owner.
      - name: Check the Claude Code token
        id: auth
        if: ${{ !inputs.dry_run && steps.preflight.outputs.work == 'true' && (inputs.harness || 'claude-code') == 'claude-code' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.306
          if OUT=$(claude -p "Reply with the single word OK." --max-turns 1 2>&1); then
            echo "ok=true" >> "${GITHUB_OUTPUT}"
            echo "Claude Code token accepted"
          else
            echo "ok=false" >> "${GITHUB_OUTPUT}"
            echo "::error::Claude Code could not start, so this worker claims nothing: $(printf '%s' "${OUT}" | tr '\n' ' ' | head -c 300)"
          fi

      - name: Report a refused token
        if: ${{ steps.auth.outputs.ok == 'false' }}
        run: |
          if [ "${ASTRID_AGENT_SLOT}" = 1 ]; then
            npx tsx scripts/report-harness-auth-failure.ts --list "${ASTRID_OAUTH_LIST_ID}" \
              --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --repo "${GITHUB_REPOSITORY}" || true
          fi
          exit 1

      - name: Take this worker's task
        id: take
        if: ${{ !inputs.dry_run && steps.preflight.outputs.work == 'true' && steps.auth.outputs.ok != 'false' }}
        env:
          AGENT: ${{ steps.preflight.outputs.agent }}
          USE_RUNNER: ${{ inputs.use_runner }}
        run: |
          if [ "${ASTRID_AGENT_SLOT}" = 1 ]; then
            echo "go=true" >> "${GITHUB_OUTPUT}"
            echo "Slot 1 chooses in the session: the inbox, a resume, or the next Ready task"
            exit 0
          fi
          # use_runner (ADEV-86): astrid-agent run claims inside the Run Claude Code step.
          if [ "${USE_RUNNER}" = true ]; then
            echo "go=true" >> "${GITHUB_OUTPUT}"
            echo "Slot ${ASTRID_AGENT_SLOT} claims through astrid-agent run in the Run step"
            exit 0
          fi
          npx tsx scripts/claim-next-fixall-task.ts --agent "${AGENT}" --list "${ASTRID_OAUTH_LIST_ID}" \
            --preflight .agent-output/preflight.json > .agent-output/claim-next.txt && STATUS=0 || STATUS=$?
          cat .agent-output/claim-next.txt
          if [ "${STATUS}" = 3 ]; then
            echo "go=false" >> "${GITHUB_OUTPUT}"
            echo "Every Ready task is taken by another worker or session; slot ${ASTRID_AGENT_SLOT} has nothing to do"
            exit 0
          fi
          if [ "${STATUS}" != 0 ]; then exit "${STATUS}"; fi
          TASK=$(sed -n 's/^CLAIMED \([^ ]*\).*/\1/p' .agent-output/claim-next.txt | head -1)
          if ! [[ "${TASK}" =~ ^[A-Za-z0-9-]+$ ]]; then
            echo "::error::claim-next reported a claim without a task id"
            exit 1
          fi
          echo "ASTRID_CLAIMED_TASK=${TASK}" >> "${GITHUB_ENV}"
          echo "go=true" >> "${GITHUB_OUTPUT}"

      - name: Install the astrid-core Rust toolchain
        if: ${{ !inputs.dry_run && steps.take.outputs.go == 'true' && steps.core-queue.outputs.core == 'true' }}
        working-directory: ${{ env.ASTRID_CORE_DIR }}
        run: |
          if ! command -v rustup >/dev/null; then
            echo "::error::rustup is not on this runner image; astrid-core needs it"
            exit 1
          fi
          # The channel astrid-core pins, read the way its own msrv job reads it.
          CHANNEL=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -1)
          if [ -z "${CHANNEL}" ]; then
            echo "::error::Could not read the channel from astrid-core's rust-toolchain.toml"
            exit 1
          fi
          rustup toolchain install "${CHANNEL}" --profile minimal \
            --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup show active-toolchain

      - name: Cache astrid-core's cargo build
        if: ${{ !inputs.dry_run && steps.take.outputs.go == 'true' && steps.core-queue.outputs.core == 'true' }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ${{ env.ASTRID_CORE_DIR }} -> target
          key: agent-run

      - name: Build and verify Astrid MCP
        if: ${{ !inputs.dry_run && steps.take.outputs.go == 'true' }}
        run: |
          npm run build:mcp:oauth
          node --input-type=module -e '
            import {Client} from "@modelcontextprotocol/sdk/client/index.js";
            import {StdioClientTransport} from "@modelcontextprotocol/sdk/client/stdio.js";
            const client=new Client({name:"agent-preflight",version:"1"});
            const transport=new StdioClientTransport({command:"node",args:["mcp/astrid-mcp-launch.js"],env:process.env});
            try {
              await client.connect(transport);
              const {tools}=await client.listTools();
              for(const name of ["get_agent_queue","get_task","get_task_comments","add_comment","update_task"])
                if(!tools.some(t=>t.name===name)) throw new Error(`Missing MCP tool ${name}`);
            } finally { await client.close(); }
          '
          node -e '
            const fs=require("fs");
            const server={command:"node",args:[process.cwd()+"/mcp/astrid-mcp-launch.js"]};
            fs.writeFileSync(process.env.RUNNER_TEMP+"/astrid-mcp.json",JSON.stringify({mcpServers:{astrid:server}}));
          '

      # Signed-in e2e work needs a browser before the agent starts: the agent's
      # sandbox allows npm scripts, not `npx playwright install` (AWTD-1405 was
      # handed back for exactly that). Agent setup has already migrated the
      # database; migrating it again here failed with P3005 (AWTD-1410).
      - name: Install Chromium for e2e
        if: ${{ !inputs.dry_run && steps.take.outputs.go == 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Run Claude Code
        id: claude
        timeout-minutes: 75
        if: ${{ !inputs.dry_run && steps.take.outputs.go == 'true' && (inputs.harness || 'claude-code') == 'claude-code' }}
        env:
          # Subscription token from `claude setup-token` — never an API key
          # (Jon, 2026-09-19: the loops run on the subscription).
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          HEARTBEAT_AGENT: ${{ steps.preflight.outputs.agent }}
          USE_RUNNER: ${{ inputs.use_runner }}
          PINNED_TASK: ${{ inputs.use_runner && inputs.task_id || '' }}
        run: |
          set -o pipefail
          # The CLI was installed by "Check the Claude Code token" (ADEV-236).
          # Renew this run's claim leases while the agent works (ADEV-37): MCP claim_task
          # holds a 15-minute lease, and without a heartbeat the task went back to Ready
          # mid-run. Only leases taken since now are renewed (scripts/lib/held-claims.ts).
          export ASTRID_RUN_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ( while sleep 300; do
              npx tsx scripts/heartbeat-held-claims.ts --agent "${HEARTBEAT_AGENT}" --list "${ASTRID_OAUTH_LIST_ID}" || true
            done ) &
          HEARTBEAT=$!
          trap 'kill "${HEARTBEAT}" 2>/dev/null || true' EXIT
          # The core checkout is outside the workspace, so it is added to what the agent may edit.
          # The prompt ends with this run's ASTRID_CORE_PUSH (ADEV-33): on 2026-11-16 a worker
          # claimed a core task, could not "tell whether this run can push", and released it.
          # One function, so the shell claim and astrid-agent run (ADEV-86) start the
          # same claude. The runner sets ASTRID_TASK_ID where the shell claim set
          # ASTRID_CLAIMED_TASK.
          run_claude() {
            set -o pipefail
            ASTRID_CLAIMED_TASK="${ASTRID_TASK_ID:-${ASTRID_CLAIMED_TASK:-}}"
            CORE_DIRS=()
            if [ -n "${ASTRID_CORE_DIR:-}" ]; then CORE_DIRS=(--add-dir "${ASTRID_CORE_DIR}"); fi
            claude -p "$(cat .github/agent-run-prompt.md; printf '\n\n**This run (set by the runner):** ASTRID_CORE_PUSH=%s. 1 means you can push to astrid-core, so a `[core]` task is yours to do; 0 means take a web task. ASTRID_CLAIMED_TASK=%s. A task id means the runner already claimed that task for you (Doing, assigned to you): work it and do not run a claim script; empty means you are slot 1 and claim in the session.\n' "${ASTRID_CORE_PUSH:-0}" "${ASTRID_CLAIMED_TASK:-}")" \
              --mcp-config "${RUNNER_TEMP}/astrid-mcp.json" --strict-mcp-config \
              "${CORE_DIRS[@]}" \
              --permission-mode acceptEdits \
              --allowedTools "Bash(npm run *),Bash(npx tsx scripts/*),Bash(npx vitest *),Bash(git *),Bash(gh pr *),Bash(cargo *),Bash(rustup *),Bash(node scripts/*),mcp__astrid__*,Read,Edit,Write,Grep,Glob" \
              | tee .agent-output/agent-transcript.txt
          }
          if [ "${USE_RUNNER}" = true ] && [ "${ASTRID_AGENT_SLOT}" != 1 ]; then
            # The runner spawns --command through /bin/sh (dash here), which drops the
            # BASH_FUNC_* variable an exported bash function travels in, so bash gets it as a file.
            declare -f run_claude > "${RUNNER_TEMP}/run-claude.sh"
            echo run_claude >> "${RUNNER_TEMP}/run-claude.sh"
            export ASTRID_CORE_PUSH
            TASK_FLAGS=()
            if [ -n "${PINNED_TASK}" ]; then
              # The server's ready claim matches only a Ready task. Move the pinned task there right
              # before the claim: a worker woken by the move needs minutes to start, the claim ms.
              npx tsx scripts/set-task-status.ts "${PINNED_TASK}" Ready
              TASK_FLAGS=(--task "${PINNED_TASK}")
            fi
            npx --yes -p @gracefultools/astrid-sdk@1.0.3 astrid-agent run --agent "${HEARTBEAT_AGENT}" \
              --list "${ASTRID_OAUTH_LIST_ID}" --include-unassigned --fixall --harness custom \
              "${TASK_FLAGS[@]}" --command "bash \"${RUNNER_TEMP}/run-claude.sh\"" && STATUS=0 || STATUS=$?
            if [ "${STATUS}" = 3 ]; then
              echo "RESULT: SKIPPED — every Ready task is taken by another worker or session" | tee .agent-output/agent-transcript.txt
              exit 0
            fi
            exit "${STATUS}"
          fi
          run_claude

      - name: Run Codex
        id: codex
        timeout-minutes: 75
        if: ${{ !inputs.dry_run && steps.take.outputs.go == 'true' && (inputs.harness || 'claude-code') == 'codex' }}
        env:
          CODEX_VERSION: ${{ vars.CODEX_VERSION }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          HEARTBEAT_AGENT: ${{ steps.preflight.outputs.agent }}
        run: |
          # Unverified: set the CODEX_VERSION variable and the CODEX_AUTH_JSON
          # secret (a ChatGPT-plan login) before the first codex run.
          if [ -z "${CODEX_VERSION}" ] || [ -z "${CODEX_AUTH_JSON}" ]; then
            echo "::error::codex harness is not configured (CODEX_VERSION / CODEX_AUTH_JSON)"
            exit 1
          fi
          set -o pipefail
          npm install --global "@openai/codex@${CODEX_VERSION}"
          # Renew this run's claim leases while the agent works (ADEV-37): MCP claim_task
          # holds a 15-minute lease, and without a heartbeat the task went back to Ready
          # mid-run. Only leases taken since now are renewed (scripts/lib/held-claims.ts).
          export ASTRID_RUN_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ( while sleep 300; do
              npx tsx scripts/heartbeat-held-claims.ts --agent "${HEARTBEAT_AGENT}" --list "${ASTRID_OAUTH_LIST_ID}" || true
            done ) &
          HEARTBEAT=$!
          trap 'kill "${HEARTBEAT}" 2>/dev/null || true' EXIT
          mkdir -p ~/.codex && printf '%s' "${CODEX_AUTH_JSON}" > ~/.codex/auth.json
          CORE_ROOTS=()
          if [ -n "${ASTRID_CORE_DIR:-}" ]; then
            CORE_ROOTS=(-c "sandbox_workspace_write.writable_roots=[\"${ASTRID_CORE_DIR}\"]")
          fi
          codex -c 'mcp_servers.astrid.command="node"' \
            -c "mcp_servers.astrid.args=[\"${GITHUB_WORKSPACE}/mcp/astrid-mcp-launch.js\"]" \
            -c sandbox_workspace_write.network_access=true \
            "${CORE_ROOTS[@]}" \
            exec --full-auto "$(cat .github/agent-run-prompt.md; printf '\n\n**This run (set by the runner):** ASTRID_CORE_PUSH=%s. 1 means you can push to astrid-core, so a `[core]` task is yours to do; 0 means take a web task. ASTRID_CLAIMED_TASK=%s. A task id means the runner already claimed that task for you (Doing, assigned to you): work it and do not run a claim script; empty means you are slot 1 and claim in the session.\n' "${ASTRID_CORE_PUSH:-0}" "${ASTRID_CLAIMED_TASK:-}")" | tee .agent-output/agent-transcript.txt

      # The harness exits 0 whether or not the agent finished. Smoke test 2
      # (AWTD-1366) could not open its PR, said RESULT: PARTIAL, and went green,
      # so a broken loop looked like a working one. The agent's own last RESULT
      # line is the verdict; cleanup steps below still run on always().
      - name: Fail the run unless the agent reports OK or SKIPPED
        id: verdict
        if: ${{ !inputs.dry_run && steps.take.outputs.go == 'true' }}
        run: |
          RESULT=$(grep -E '^RESULT: ' .agent-output/agent-transcript.txt 2>/dev/null | tail -1 || true)
          echo "${RESULT:-no RESULT line}"
          # OK or SKIPPED as a whole word, alone or followed by a note. Not
          # "RESULT: OKAY", and not the prompt's own format line
          # "RESULT: OK | SKIPPED | …" echoed back (AWTD-1424).
          if ! printf '%s\n' "${RESULT}" | grep -qE '^RESULT: (OK|SKIPPED)($| +[^| ])'; then
            # A PARTIAL run still made progress (2026-11-16: an open PR, one
            # item left), so the chain keeps going; the run stays red.
            if printf '%s\n' "${RESULT}" | grep -qE '^RESULT: PARTIAL($| +[^| ])'; then
              echo "result=PARTIAL" >> "${GITHUB_OUTPUT}"
            fi
            echo "::error::The agent did not finish: ${RESULT:-it printed no RESULT line}"
            exit 1
          fi
          echo "result=$(printf '%s\n' "${RESULT}" | sed -E 's/^RESULT: (OK|SKIPPED).*/\1/')" >> "${GITHUB_OUTPUT}"

      - name: Preserve unfinished work
        if: ${{ always() && !inputs.dry_run && steps.take.outputs.go == 'true' }}
        run: |
          DIRTY=$(git status --porcelain)
          UNPUSHED=$(git rev-list --count HEAD --not --remotes=origin)
          if [ -n "${DIRTY}" ] || [ "${UNPUSHED}" != 0 ]; then
            BRANCH=$(git branch --show-current)
            if [ "${BRANCH}" = main ] || [ -z "${BRANCH}" ]; then
              git switch -c "agent/${ASTRID_FIXALL_HARNESS}/recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            fi
            if [ -n "${DIRTY}" ]; then
              git add --all
              git commit -m "wip: agent run ${GITHUB_RUN_ID} UNFINISHED, UNVERIFIED"
            fi
            mkdir -p .agent-output
            git bundle create .agent-output/recovery.bundle HEAD --not --remotes=origin
            git rev-parse HEAD > .agent-output/recovery-head.txt
            # A task branch that moved on origin refuses this push (ADEV-33):
            # the same HEAD goes to a recovery branch instead, never forced.
            if ! git push --set-upstream origin HEAD; then
              RECOVERY="agent/${ASTRID_FIXALL_HARNESS}/recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              echo "::warning::origin/${BRANCH} moved on; pushing this run's work to ${RECOVERY}"
              git push origin "HEAD:refs/heads/${RECOVERY}"
            fi
          fi

      # The same rescue for the core checkout (AWTD-1682): a run that died mid core task
      # leaves its work on agent/<harness>/recovery-… in astrid-core, and the bundle in
      # this run's artifact if that push is refused.
      - name: Preserve unfinished astrid-core work
        if: ${{ always() && !inputs.dry_run && steps.take.outputs.go == 'true' && env.ASTRID_CORE_DIR != '' }}
        working-directory: ${{ env.ASTRID_CORE_DIR }}
        run: |
          DIRTY=$(git status --porcelain)
          UNPUSHED=$(git rev-list --count HEAD --not --remotes=origin)
          if [ -n "${DIRTY}" ] || [ "${UNPUSHED}" != 0 ]; then
            BRANCH=$(git branch --show-current)
            if [ "${BRANCH}" = main ] || [ -z "${BRANCH}" ]; then
              git switch -c "agent/${ASTRID_FIXALL_HARNESS}/recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            fi
            if [ -n "${DIRTY}" ]; then
              git add --all
              git commit -m "wip: agent run ${GITHUB_RUN_ID} UNFINISHED, UNVERIFIED"
            fi
            mkdir -p "${GITHUB_WORKSPACE}/.agent-output"
            git bundle create "${GITHUB_WORKSPACE}/.agent-output/core-recovery.bundle" HEAD --not --remotes=origin
            git rev-parse HEAD > "${GITHUB_WORKSPACE}/.agent-output/core-recovery-head.txt"
            # A task branch that moved on origin refuses this push (ADEV-33):
            # the same HEAD goes to a recovery branch instead, never forced.
            if ! git push --set-upstream origin HEAD; then
              RECOVERY="agent/${ASTRID_FIXALL_HARNESS}/recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              echo "::warning::origin/${BRANCH} moved on; pushing this run's work to ${RECOVERY}"
              git push origin "HEAD:refs/heads/${RECOVERY}"
            fi
          fi

      - name: Register finished cloud handoffs
        if: ${{ always() && !inputs.dry_run && steps.take.outputs.go == 'true' }}
        env:
          AGENT: ${{ steps.preflight.outputs.agent }}
        run: |
          npx tsx scripts/open-fixall-prs.ts --claims-file "${ASTRID_FIXALL_CLAIMS_FILE}" \
            --repo "${GITHUB_WORKSPACE}" --cloud-agent "${AGENT}" --list "${ASTRID_OAUTH_LIST_ID}"

      - name: Release unfinished claims
        if: ${{ always() && !inputs.dry_run && steps.preflight.outputs.agent != '' }}
        env:
          AGENT: ${{ steps.preflight.outputs.agent }}
        run: |
          # ADEV-236: a harness that failed before printing anything never started; that
          # release says so and does not count toward the two-release handback.
          npx tsx scripts/release-stuck-doing.ts --agent "${AGENT}" \
            --claims-file "${ASTRID_FIXALL_CLAIMS_FILE}" \
            --harness-outcome "${{ steps.claude.outcome }}" --transcript .agent-output/agent-transcript.txt

      - name: Record wake outcome
        if: ${{ always() && !inputs.dry_run && steps.take.outputs.go == 'true' && matrix.slot == 1 }}
        env:
          AGENT: ${{ steps.preflight.outputs.agent }}
          RUN_OK: ${{ job.status == 'success' }}
        run: |
          FLAGS=()
          if [ "${RUN_OK}" != true ]; then FLAGS+=(--failed); fi
          npx tsx scripts/agent-queue-status.ts --agent "${AGENT}" --list "${ASTRID_OAUTH_LIST_ID}" \
            --seen .agent-state/seen.json --mark-seen --seen-keys-file .agent-output/wake-keys.json "${FLAGS[@]}"

      - name: Persist durable wake state
        if: ${{ always() && !inputs.dry_run && steps.take.outputs.go == 'true' && matrix.slot == 1 }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .agent-state
          key: agent-wake-v1-${{ (inputs.harness || 'claude-code') }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Persist run outputs and recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          # Per slot, or N workers would collide on one name. restore-cloud-wake-state.ts
          # reads slot 1's (scripts/lib/wake-state-artifact.ts).
          name: agent-run-${{ (inputs.harness || 'claude-code') }}-${{ github.run_id }}-slot-${{ matrix.slot }}
          path: |
            .agent-output/
            .agent-state/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      # What the chain job reads (ADEV-26). Written by the runner, not the agent,
      # into RUNNER_TEMP rather than .agent-output, which the agent can write. A
      # PARTIAL worker is red but still records its word, so the chain goes on.
      - name: Record this worker's verdict for the chain
        if: ${{ !cancelled() && steps.verdict.outputs.result != '' }}
        env:
          RESULT: ${{ steps.verdict.outputs.result }}
        run: |
          mkdir -p "${RUNNER_TEMP}/agent-verdict"
          printf '%s\n' "${RESULT}" > "${RUNNER_TEMP}/agent-verdict/result.txt"

      - name: Upload this worker's verdict
        if: ${{ !cancelled() && steps.verdict.outputs.result != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agent-verdict-${{ (inputs.harness || 'claude-code') }}-${{ github.run_id }}-slot-${{ matrix.slot }}
          path: ${{ runner.temp }}/agent-verdict/result.txt
          if-no-files-found: error
          retention-days: 7

  # GitHub creates scheduled runs when it can, not when asked: from 10-29 to
  # 10-31 it created 10 of the ~100 runs ':05,35' asks for, so the queue drained
  # one task every four or five hours. A run that finished a task starts the
  # next one; a run that finds nothing (SKIPPED), fails, or reaches the depth cap
  # ends the chain, and the schedule stays as the fallback. Shipping is started
  # by the agent PR's CI finishing (agent-ship.yml).
  #
  # It starts the next run with a repository_dispatch, which needs only the
  # Contents write AGENT_GH_TOKEN already has. A workflow_dispatch would need
  # actions: write, and with that the job could dispatch a production deploy.
  # Only the default harness chains: a repository_dispatch carries no inputs.
  #
  # With N workers (ADEV-26) the run chains ONCE if ANY worker reported OK or
  # PARTIAL (progress made): one
  # finished task means the queue may hold more, and the next run brings all N
  # slots back. It reads the per-slot verdict artifacts, not needs.run.outputs,
  # which a matrix overwrites with whichever worker finished last. It runs after
  # a red or partly superseded matrix too (not after a cancelled workflow), so
  # one worker's PARTIAL never stops the chain a sibling's OK earned. The depth
  # cap is unchanged: one dispatch per run, depth + 1.
  chain:
    name: Start the next run
    needs: run
    # Owner-only: a fork's schedule and events run nothing here (ADEV-103).
    if: ${{ github.repository_owner == 'Graceful-Tools' && (!cancelled() && !inputs.dry_run && (inputs.harness || 'claude-code') == 'claude-code' && needs.run.result != 'skipped') }}
    runs-on: ubuntu-26.04
    # AGENT_GH_TOKEN is an `agent` environment secret; without this it reads empty.
    environment: agent
    timeout-minutes: 5
    permissions: {}
    env:
      GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
      GH_REPO: ${{ github.repository }}
      DEPTH: ${{ github.event.client_payload.chain_depth || '0' }}
      MAX_CHAIN: ${{ vars.ASTRID_AGENT_MAX_CHAIN || '8' }}
    steps:
      # This run's artifacts only, through the job's runtime token: no
      # permission, and a pattern that matches nothing downloads nothing.
      - name: Collect the workers' verdicts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: agent-verdict-claude-code-${{ github.run_id }}-slot-*
          path: ${{ runner.temp }}/agent-verdicts

      - name: Start the next run unless the chain is at its cap
        env:
          VERDICTS: ${{ runner.temp }}/agent-verdicts
        run: |
          if ! grep -rqsxE 'OK|PARTIAL' "${VERDICTS}"; then
            echo "No worker reported OK or PARTIAL (nothing done, or none finished); the schedule takes over"
            exit 0
          fi
          if [ "${DEPTH}" -ge "${MAX_CHAIN}" ]; then
            echo "Chain depth ${DEPTH} reached ASTRID_AGENT_MAX_CHAIN=${MAX_CHAIN}; the schedule takes over"
            exit 0
          fi
          gh api "repos/${GH_REPO}/dispatches" -f event_type=agent-run-next -F "client_payload[chain_depth]=$((DEPTH + 1))"
          echo "Started run $((DEPTH + 1)) of at most ${MAX_CHAIN}"
