name: 'Agent Run'

# One /fixall pass on the web board by a coding agent on an ephemeral runner.
# The harness is an input; everything else — setup, queue, claim, gates, what
# the run produces — is the same for every harness (docs/AGENT_FLEET.md).
#
# The GitHub Copilot coding agent does not come through here: GitHub runs it
# itself, using copilot-setup-steps.yml, which calls the same setup action.
#
# What this job can NOT do, on purpose:
#   - read production credentials: it declares the `agent` environment, never
#     `production`, so the database secrets are not released to it;
#   - deploy: it has no `actions: write`, so it cannot dispatch
#     production-deployment.yml. The run ends at a pushed branch, an open PR and
#     a comment on the task. Merging and deploying are the ship workflow's job
#     (docs/AGENT_FLEET.md → Shipping).
#
# Dispatch-only while this is new. A schedule comes once a few runs have
# landed clean PRs, and then the Mac's launchd web loop is unloaded.
on:
  workflow_dispatch:
    inputs:
      harness:
        description: 'Which coding agent runs the pass'
        required: true
        default: 'claude-code'
        type: choice
        options:
          - claude-code
          - codex
      dry_run:
        description: 'List the queue without working it'
        required: false
        default: false
        type: boolean

concurrency:
  group: agent-run-${{ inputs.harness }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    name: 'Agent run (${{ inputs.harness }})'
    runs-on: ubuntu-24.04
    environment: agent
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: astrid_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      ASTRID_OAUTH_CLIENT_ID: ${{ secrets.ASTRID_OAUTH_CLIENT_ID }}
      ASTRID_OAUTH_CLIENT_SECRET: ${{ secrets.ASTRID_OAUTH_CLIENT_SECRET }}
      ASTRID_FIXALL_HARNESS: ${{ inputs.harness }}
      # docs/FIXALL_WORKFLOW.md → On an ephemeral runner: the checkout is this
      # job's alone (no lock), production is out of reach (prod questions are
      # handbacks), and the run stops at the PR.
      ASTRID_FIXALL_EPHEMERAL: '1'
      ASTRID_FIXALL_MAX_TASKS: ${{ vars.ASTRID_FIXALL_MAX_TASKS || '1' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Agent setup
        uses: ./.github/actions/agent-setup

      - name: Identify the run in git
        run: |
          git config user.name "Astrid agent (${ASTRID_FIXALL_HARNESS})"
          git config user.email "agent-${ASTRID_FIXALL_HARNESS}@users.noreply.github.com"

      - name: Queue (dry run)
        if: ${{ inputs.dry_run }}
        run: npx tsx scripts/ready-tasks.ts web --harness "${ASTRID_FIXALL_HARNESS}" --dry-run

      - name: Run Claude Code
        if: ${{ !inputs.dry_run && inputs.harness == 'claude-code' }}
        env:
          # Subscription token from `claude setup-token` — never an API key
          # (Jon, 2026-09-19: the loops run on the subscription).
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.306
          claude -p "$(cat .github/agent-run-prompt.md)" \
            --permission-mode acceptEdits \
            --allowedTools "Bash(npm run *),Bash(npx tsx scripts/*),Bash(npx vitest *),Bash(git *),Bash(gh pr *),Read,Edit,Write,Grep,Glob"

      - name: Run Codex
        if: ${{ !inputs.dry_run && inputs.harness == 'codex' }}
        env:
          CODEX_VERSION: ${{ vars.CODEX_VERSION }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          # Unverified: set the CODEX_VERSION variable and the CODEX_AUTH_JSON
          # secret (a ChatGPT-plan login) before the first codex run.
          if [ -z "${CODEX_VERSION}" ] || [ -z "${CODEX_AUTH_JSON}" ]; then
            echo "::error::codex harness is not configured (CODEX_VERSION / CODEX_AUTH_JSON)"
            exit 1
          fi
          npm install --global "@openai/codex@${CODEX_VERSION}"
          mkdir -p ~/.codex && printf '%s' "${CODEX_AUTH_JSON}" > ~/.codex/auth.json
          codex exec --full-auto "$(cat .github/agent-run-prompt.md)"
