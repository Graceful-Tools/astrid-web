name: 'Fix All Ready Tasks'

# Concurrency: if a run is already in progress for the same harness, skip the
# new one rather than cancel it (cancel-in-progress: false). This is safe for
# the 30-minute schedule because a long-running task won't be interrupted.
concurrency:
  group: fixall-${{ github.event.inputs.harness || 'github-copilot' }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      harness:
        description: 'Agent harness identity (determines which assigned tasks are claimed)'
        required: false
        default: 'github-copilot'
        type: choice
        options:
          - github-copilot
          - claude-code
          - codex
          - astrid-server
      dry_run:
        description: 'Dry run — list ready tasks without working them'
        required: false
        default: false
        type: boolean
      runner:
        description: 'Runner target (cloud is a manual backup, not automatic failover)'
        required: false
        default: 'local'
        type: choice
        options:
          - local
          - cloud

  schedule:
    # Every 30 minutes, 24/7. GitHub Actions minimum is 5 minutes; 30 is safe.
    - cron: '*/30 * * * *'

env:
  NODE_VERSION: '20'

jobs:
  list-ready-tasks:
    name: 'List Ready Tasks'
    # Scheduled runs and the default manual path use the dedicated organization
    # runner. A queued self-hosted job cannot automatically fail over to cloud.
    runs-on: ${{ fromJSON(inputs.runner == 'cloud' && '["ubuntu-latest"]' || '["self-hosted","astrid-web"]') }}
    outputs:
      has_tasks: ${{ steps.list.outputs.has_tasks }}
      task_count: ${{ steps.list.outputs.task_count }}
      task_ids: ${{ steps.list.outputs.task_ids }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: List ready tasks
        id: list
        env:
          ASTRID_OAUTH_CLIENT_ID: ${{ secrets.ASTRID_OAUTH_CLIENT_ID }}
          ASTRID_OAUTH_CLIENT_SECRET: ${{ secrets.ASTRID_OAUTH_CLIENT_SECRET }}
          # Scheduled runs always use github-copilot so only tasks assigned to
          # copilot@<domain> are claimed. Manual dispatch can override this.
          ASTRID_FIXALL_HARNESS: ${{ inputs.harness || 'github-copilot' }}
          ASTRID_FIXALL_DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          HARNESS="${ASTRID_FIXALL_HARNESS}"
          echo "Fetching ready tasks for harness: ${HARNESS}"

          DRY_RUN_ARG=""
          if [ "${ASTRID_FIXALL_DRY_RUN}" = "true" ]; then
            DRY_RUN_ARG="--dry-run"
          fi

          if ! OUTPUT=$(npx tsx scripts/ready-tasks.ts --harness "${HARNESS}" ${DRY_RUN_ARG} 2>&1); then
            printf '%s\n' "${OUTPUT}"
            exit 1
          fi
          echo "${OUTPUT}"

          # Parse every actionable section strictly. RECHECK and REVIEW are work,
          # even when the Ready queue itself is empty.
          if ! TASK_IDS=$(printf '%s\n' "${OUTPUT}" | npx tsx scripts/parse-ready-tasks-output.ts); then
            exit 1
          fi
          TASK_COUNT=$(printf '%s\n' "${TASK_IDS}" | sed '/^$/d' | wc -l | tr -d ' ')

          echo "task_count=${TASK_COUNT}" >> "${GITHUB_OUTPUT}"
          {
            echo "task_ids<<ASTRID_TASK_IDS"
            printf '%s\n' "${TASK_IDS}"
            echo "ASTRID_TASK_IDS"
          } >> "${GITHUB_OUTPUT}"

          if [ "${TASK_COUNT}" -gt 0 ]; then
            echo "has_tasks=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_tasks=false" >> "${GITHUB_OUTPUT}"
          fi

  dry-run-report:
    name: 'Dry Run — Task Report'
    runs-on: ${{ fromJSON(inputs.runner == 'cloud' && '["ubuntu-latest"]' || '["self-hosted","astrid-web"]') }}
    needs: list-ready-tasks
    if: ${{ inputs.dry_run == true }}
    steps:
      - name: Report
        run: |
          echo "## Ready Tasks (Dry Run)"
          echo "Harness: ${{ inputs.harness || 'github-copilot' }}"
          echo "Tasks found: ${{ needs.list-ready-tasks.outputs.task_count }}"
          echo ""
          echo "Re-run without dry_run to work these tasks."

  work-tasks:
    name: 'Work Ready Tasks'
    runs-on: ${{ fromJSON(inputs.runner == 'cloud' && '["ubuntu-latest"]' || '["self-hosted","astrid-web"]') }}
    needs: list-ready-tasks
    if: ${{ inputs.dry_run != true && needs.list-ready-tasks.outputs.has_tasks == 'true' }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Trigger Astrid coding agent for each task
        id: trigger
        env:
          ASTRID_MCP_TOKEN: ${{ secrets.ASTRID_MCP_TOKEN }}
          ASTRID_FIXALL_HARNESS: ${{ inputs.harness || 'github-copilot' }}
          ASTRID_TASK_IDS: ${{ needs.list-ready-tasks.outputs.task_ids }}
          ASTRID_TRIGGER_URL: 'https://astrid.cc/api/coding-agent/github-trigger'
        run: |
          HARNESS="${ASTRID_FIXALL_HARNESS}"
          TASK_COUNT="${{ needs.list-ready-tasks.outputs.task_count }}"
          echo "Triggering ready tasks for harness: ${HARNESS}"
          echo "Task count: ${TASK_COUNT}"

          if [ -z "${ASTRID_MCP_TOKEN}" ]; then
            echo "::error::ASTRID_MCP_TOKEN is not configured"
            exit 1
          fi

          TRIGGERED=0
          FAILED=0
          while IFS= read -r TASK_ID; do
            [ -n "${TASK_ID}" ] || continue
            echo "Triggering coding workflow for task ${TASK_ID}"

            PAYLOAD_FILE=$(mktemp)
            RESPONSE_FILE=$(mktemp)
            TASK_ID="${TASK_ID}" node -e '
              const payload = {
                taskId: process.env.TASK_ID,
                githubContext: {
                  repository: process.env.GITHUB_REPOSITORY,
                  ref: process.env.GITHUB_REF,
                  sha: process.env.GITHUB_SHA,
                  actor: process.env.GITHUB_ACTOR,
                  workflow: process.env.GITHUB_WORKFLOW,
                  runId: process.env.GITHUB_RUN_ID,
                  runNumber: process.env.GITHUB_RUN_NUMBER,
                },
              }
              process.stdout.write(JSON.stringify(payload))
            ' > "${PAYLOAD_FILE}"

            HTTP_STATUS=$(curl --silent --show-error --retry 2 --retry-all-errors \
              --output "${RESPONSE_FILE}" --write-out '%{http_code}' \
              --request POST "${ASTRID_TRIGGER_URL}" \
              --header 'Content-Type: application/json' \
              --header "Authorization: Bearer ${ASTRID_MCP_TOKEN}" \
              --data-binary "@${PAYLOAD_FILE}") || HTTP_STATUS="000"

            rm -f "${PAYLOAD_FILE}"
            if [[ "${HTTP_STATUS}" =~ ^2[0-9][0-9]$ ]]; then
              TRIGGERED=$((TRIGGERED + 1))
              echo "Coding workflow accepted for task ${TASK_ID}"
            else
              FAILED=$((FAILED + 1))
              echo "::error::Coding workflow trigger failed for task ${TASK_ID} (HTTP ${HTTP_STATUS})"
              cat "${RESPONSE_FILE}"
            fi
            rm -f "${RESPONSE_FILE}"
          done <<< "${ASTRID_TASK_IDS}"

          {
            echo "triggered_count=${TRIGGERED}"
            echo "failed_count=${FAILED}"
          } >> "${GITHUB_OUTPUT}"

          if [ "${FAILED}" -gt 0 ]; then
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## Fix All Trigger Summary"
            echo "- Harness: \`${{ inputs.harness || 'github-copilot' }}\`"
            echo "- Actionable tasks: ${{ needs.list-ready-tasks.outputs.task_count }}"
            echo "- Agent workflows triggered: ${{ steps.trigger.outputs.triggered_count || '0' }}"
            echo "- Trigger failures: ${{ steps.trigger.outputs.failed_count || '0' }}"
            echo ""
            echo "> Agent workflows run asynchronously. This Action does not claim they completed, merged, or deployed."
          } >> "${GITHUB_STEP_SUMMARY}"

  no-tasks:
    name: 'Nothing to do'
    runs-on: ${{ fromJSON(inputs.runner == 'cloud' && '["ubuntu-latest"]' || '["self-hosted","astrid-web"]') }}
    needs: list-ready-tasks
    if: ${{ needs.list-ready-tasks.outputs.has_tasks == 'false' }}
    steps:
      - name: No ready tasks
        run: |
          echo "✅ No ready tasks found for harness: ${{ inputs.harness || 'github-copilot' }}"
          echo "Ready list is empty — nothing to do."