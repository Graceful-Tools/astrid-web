name: 'Fix All Ready Tasks'

# Concurrency: if a run is already in progress for the same harness, skip the
# new one rather than cancel it (cancel-in-progress: false). This is safe for
# the 30-minute schedule because a long-running task won't be interrupted.
concurrency:
  group: fixall-github-copilot
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — list ready tasks without working them'
        required: false
        default: false
        type: boolean
      runner:
        description: 'Runner target (cloud is a manual backup, not automatic failover)'
        required: false
        default: 'local'
        type: choice
        options:
          - local
          - cloud

  schedule:
    # Every 30 minutes, 24/7. GitHub Actions minimum is 5 minutes; 30 is safe.
    - cron: '*/30 * * * *'

env:
  NODE_VERSION: '20'

jobs:
  list-ready-tasks:
    name: 'List Ready Tasks'
    # Scheduled runs and the default manual path use the dedicated organization
    # runner. A queued self-hosted job cannot automatically fail over to cloud.
    runs-on: ${{ fromJSON(inputs.runner == 'cloud' && '["ubuntu-latest"]' || '["self-hosted","astrid-web"]') }}
    outputs:
      has_tasks: ${{ steps.list.outputs.has_tasks }}
      task_count: ${{ steps.list.outputs.task_count }}
      task_claims: ${{ steps.list.outputs.task_claims }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: List ready tasks
        id: list
        env:
          ASTRID_OAUTH_CLIENT_ID: ${{ secrets.ASTRID_OAUTH_CLIENT_ID }}
          ASTRID_OAUTH_CLIENT_SECRET: ${{ secrets.ASTRID_OAUTH_CLIENT_SECRET }}
          # The fixed harness maps server-side to copilot@astrid.cc. OAuth
          # authenticates the external workflow without carrying an agent token.
          ASTRID_FIXALL_HARNESS: 'github-copilot'
          ASTRID_FIXALL_DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          HARNESS="${ASTRID_FIXALL_HARNESS}"
          echo "Fetching ready tasks for harness: ${HARNESS}"

          DRY_RUN_ARG=""
          if [ "${ASTRID_FIXALL_DRY_RUN}" = "true" ]; then
            DRY_RUN_ARG="--dry-run"
          fi

          if ! OUTPUT=$(npx tsx scripts/ready-tasks.ts --json --harness "${HARNESS}" ${DRY_RUN_ARG}); then
            exit 1
          fi

          # Consume only the authoritative JSON envelope. Task titles and other
          # presentation text never become executable task IDs.
          if ! TASK_CLAIMS=$(printf '%s\n' "${OUTPUT}" | npx tsx scripts/parse-ready-tasks-output.ts --claims); then
            exit 1
          fi
          TASK_COUNT=$(printf '%s\n' "${TASK_CLAIMS}" | sed '/^$/d' | wc -l | tr -d ' ')

          echo "task_count=${TASK_COUNT}" >> "${GITHUB_OUTPUT}"
          {
            echo "task_claims<<ASTRID_TASK_CLAIMS"
            printf '%s\n' "${TASK_CLAIMS}"
            echo "ASTRID_TASK_CLAIMS"
          } >> "${GITHUB_OUTPUT}"

          if [ "${TASK_COUNT}" -gt 0 ]; then
            echo "has_tasks=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_tasks=false" >> "${GITHUB_OUTPUT}"
          fi

  dry-run-report:
    name: 'Dry Run — Task Report'
    runs-on: ${{ fromJSON(inputs.runner == 'cloud' && '["ubuntu-latest"]' || '["self-hosted","astrid-web"]') }}
    needs: list-ready-tasks
    if: ${{ inputs.dry_run == true }}
    steps:
      - name: Report
        run: |
          echo "## Ready Tasks (Dry Run)"
          echo "Harness: github-copilot"
          echo "Tasks found: ${{ needs.list-ready-tasks.outputs.task_count }}"
          echo ""
          echo "Re-run without dry_run to work these tasks."

  work-tasks:
    name: 'Work Ready Tasks'
    runs-on: ${{ fromJSON(inputs.runner == 'cloud' && '["ubuntu-latest"]' || '["self-hosted","astrid-web"]') }}
    needs: list-ready-tasks
    if: ${{ inputs.dry_run != true && needs.list-ready-tasks.outputs.has_tasks == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Assign and trigger Astrid coding agent for each task
        id: trigger
        env:
          ASTRID_OAUTH_CLIENT_ID: ${{ secrets.ASTRID_OAUTH_CLIENT_ID }}
          ASTRID_OAUTH_CLIENT_SECRET: ${{ secrets.ASTRID_OAUTH_CLIENT_SECRET }}
          ASTRID_FIXALL_HARNESS: 'github-copilot'
          ASTRID_TASK_CLAIMS: ${{ needs.list-ready-tasks.outputs.task_claims }}
          ASTRID_TRIGGER_URL: 'https://astrid.cc/api/coding-agent/github-trigger'
        run: |
          HARNESS="${ASTRID_FIXALL_HARNESS}"
          TASK_COUNT="${{ needs.list-ready-tasks.outputs.task_count }}"
          echo "Triggering ready tasks for harness: ${HARNESS}"
          echo "Task count: ${TASK_COUNT}"

          TOKEN_RESPONSE_FILE=$(mktemp)
          TOKEN_STATUS=$(curl --silent --show-error \
            --output "${TOKEN_RESPONSE_FILE}" --write-out '%{http_code}' \
            --request POST 'https://astrid.cc/api/v1/oauth/token' \
            --header 'Content-Type: application/json' \
            --data "$(node -e '
              process.stdout.write(JSON.stringify({
                grant_type: "client_credentials",
                client_id: process.env.ASTRID_OAUTH_CLIENT_ID,
                client_secret: process.env.ASTRID_OAUTH_CLIENT_SECRET,
              }))
            ')") || TOKEN_STATUS="000"
          if [[ ! "${TOKEN_STATUS}" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::OAuth token request failed (HTTP ${TOKEN_STATUS})"
            rm -f "${TOKEN_RESPONSE_FILE}"
            exit 1
          fi
          ACCESS_TOKEN=$(TOKEN_RESPONSE_FILE="${TOKEN_RESPONSE_FILE}" node -e '
            const fs = require("fs")
            const response = JSON.parse(fs.readFileSync(process.env.TOKEN_RESPONSE_FILE, "utf8"))
            if (!response.access_token) process.exit(1)
            process.stdout.write(response.access_token)
          ')
          rm -f "${TOKEN_RESPONSE_FILE}"

          TRIGGERED=0
          FAILED=0
          SKIPPED=0
          while IFS=$'\t' read -r TASK_ID TASK_ACTION COMMENT_WATERMARK; do
            [ -n "${TASK_ID}" ] || continue
            echo "Triggering coding workflow for task ${TASK_ID}"

            if npx tsx scripts/claim-fixall-task.ts \
              "${TASK_ID}" "${TASK_ACTION}" "${COMMENT_WATERMARK}"; then
              :
            elif [ "$?" -eq 2 ]; then
              SKIPPED=$((SKIPPED + 1))
              echo "::warning::Task ${TASK_ID} changed after queue selection; skipped without overwriting it"
              continue
            else
              FAILED=$((FAILED + 1))
              echo "::error::Atomic claim failed for task ${TASK_ID}"
              continue
            fi

            PAYLOAD_FILE=$(mktemp)
            RESPONSE_FILE=$(mktemp)
            TASK_ID="${TASK_ID}" node -e '
              const payload = {
                taskId: process.env.TASK_ID,
                githubContext: {
                  repository: process.env.GITHUB_REPOSITORY,
                  ref: process.env.GITHUB_REF,
                  sha: process.env.GITHUB_SHA,
                  actor: process.env.GITHUB_ACTOR,
                  workflow: process.env.GITHUB_WORKFLOW,
                  runId: process.env.GITHUB_RUN_ID,
                  runNumber: process.env.GITHUB_RUN_NUMBER,
                },
              }
              process.stdout.write(JSON.stringify(payload))
            ' > "${PAYLOAD_FILE}"

            HTTP_STATUS=$(curl --silent --show-error \
              --output "${RESPONSE_FILE}" --write-out '%{http_code}' \
              --request POST "${ASTRID_TRIGGER_URL}" \
              --header 'Content-Type: application/json' \
              --header "X-OAuth-Token: ${ACCESS_TOKEN}" \
              --data-binary "@${PAYLOAD_FILE}") || HTTP_STATUS="000"

            rm -f "${PAYLOAD_FILE}"
            if [[ "${HTTP_STATUS}" =~ ^2[0-9][0-9]$ ]]; then
              TRIGGERED=$((TRIGGERED + 1))
              echo "Coding workflow accepted for task ${TASK_ID}"
            else
              FAILED=$((FAILED + 1))
              echo "::error::Coding workflow trigger failed for task ${TASK_ID} (HTTP ${HTTP_STATUS})"
              cat "${RESPONSE_FILE}"
            fi
            rm -f "${RESPONSE_FILE}"
          done <<< "${ASTRID_TASK_CLAIMS}"

          {
            echo "triggered_count=${TRIGGERED}"
            echo "failed_count=${FAILED}"
            echo "skipped_count=${SKIPPED}"
          } >> "${GITHUB_OUTPUT}"

          if [ "${FAILED}" -gt 0 ]; then
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## Fix All Trigger Summary"
            echo "- Harness: \`github-copilot\`"
            echo "- Actionable tasks: ${{ needs.list-ready-tasks.outputs.task_count }}"
            echo "- Agent workflows triggered: ${{ steps.trigger.outputs.triggered_count || '0' }}"
            echo "- Trigger failures: ${{ steps.trigger.outputs.failed_count || '0' }}"
            echo "- Changed/conflicting tasks skipped: ${{ steps.trigger.outputs.skipped_count || '0' }}"
            echo ""
            echo "> Agent workflows run asynchronously. This Action does not claim they completed, merged, or deployed."
          } >> "${GITHUB_STEP_SUMMARY}"

  no-tasks:
    name: 'Nothing to do'
    runs-on: ${{ fromJSON(inputs.runner == 'cloud' && '["ubuntu-latest"]' || '["self-hosted","astrid-web"]') }}
    needs: list-ready-tasks
    if: ${{ needs.list-ready-tasks.outputs.has_tasks == 'false' }}
    steps:
      - name: No ready tasks
        run: |
          echo "✅ No ready tasks found for harness: github-copilot"
          echo "Ready list is empty — nothing to do."
