name: Auto-fix npm vulnerabilities

on:
  schedule:
    # Run weekly on Monday at 8am UTC
    - cron: '0 8 * * 1'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit fix (safe fixes only)
        run: |
          npm audit fix || true
          echo "## Remaining vulnerabilities:" >> $GITHUB_STEP_SUMMARY
          npm audit --json | jq -r '.vulnerabilities | to_entries[] | "- **\(.value.severity)**: \(.key) \(.value.range)"' >> $GITHUB_STEP_SUMMARY || true

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet package-lock.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No vulnerability fixes available" >> $GITHUB_STEP_SUMMARY
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Run tests
        if: steps.changes.outputs.changed == 'true'
        run: npm run test:run

      - name: Run type check
        if: steps.changes.outputs.changed == 'true'
        run: npx tsc --noEmit

      - name: Create PR with fixes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="auto/npm-audit-fix-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git add package-lock.json package.json
          git commit -m "fix: auto-resolve npm audit vulnerabilities ($(date +%Y-%m-%d))"
          git push origin "$BRANCH"

          # Ensure labels exist (idempotent - won't fail if already present)
          gh label create dependencies --color 0366d6 --description "Pull requests that update a dependency file" --force
          gh label create security --color d73a4a --description "Security-related fix or update" --force

          # Count fixed vulnerabilities
          BEFORE=$(npm audit --json 2>/dev/null | jq '.metadata.vulnerabilities | to_entries | map(.value) | add' || echo "?")

          gh pr create \
            --title "fix: auto-resolve npm audit vulnerabilities" \
            --body "$(cat <<BODY
          ## Automated npm audit fix

          This PR was automatically generated by the weekly vulnerability scan.

          **Changes:** \`npm audit fix\` applied safe (non-breaking) patches.

          **Tests:** TypeScript and Vitest passed before PR creation.

          **Remaining:** Run \`npm audit\` to see any vulnerabilities that require breaking changes.

          🤖 Generated by GitHub Actions
          BODY
          )" \
            --label "dependencies,security" \
            --base main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
