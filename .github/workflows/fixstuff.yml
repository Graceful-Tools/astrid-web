name: 'Fix Specific Task'

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Astrid task ID to work on'
        required: true
        type: string
      task_title:
        description: 'Task title (for readability — does not affect execution)'
        required: false
        type: string
      deploy_preview:
        description: 'Deploy a Vercel preview after fixing'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '20'

jobs:
  validate:
    name: 'Validate Task'
    runs-on: ubuntu-latest
    outputs:
      task_id: ${{ steps.validate.outputs.task_id }}
    steps:
      - name: Validate inputs
        id: validate
        run: |
          TASK_ID="${{ inputs.task_id }}"
          if [ -z "$TASK_ID" ]; then
            echo "❌ task_id is required"
            exit 1
          fi
          echo "task_id=${TASK_ID}" >> "${GITHUB_OUTPUT}"
          echo "✅ Task: ${TASK_ID} — ${{ inputs.task_title }}"

  fix-task:
    name: 'Fix Task'
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Post session link to task
        env:
          ASTRID_MCP_TOKEN: ${{ secrets.ASTRID_MCP_TOKEN }}
        run: |
          TASK_ID="${{ needs.validate.outputs.task_id }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Posting session link for task $TASK_ID → $RUN_URL"
          npx tsx scripts/post-session-link.ts "$TASK_ID" --url "$RUN_URL" 2>/dev/null || \
            echo "⚠️  Could not post session link (non-fatal)"

      - name: Run predeploy gates (baseline check)
        run: npm run predeploy:quick

      - name: Trigger Astrid coding agent for task
        env:
          TASK_ID: ${{ needs.validate.outputs.task_id }}
          ASTRID_MCP_TOKEN: ${{ secrets.ASTRID_MCP_TOKEN }}
          ASTRID_WEBHOOK_URL: ${{ secrets.ASTRID_WEBHOOK_URL || 'https://astrid.cc' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🤖 Working task: $TASK_ID"
          echo "Title: ${{ inputs.task_title }}"
          echo ""

          RESPONSE=$(curl -s -w "HTTPSTATUS:%{http_code}" \
            -X POST "$ASTRID_WEBHOOK_URL/api/coding-agent/github-trigger" \
            -H "Content-Type: application/json" \
            -H "X-OAuth-Token: $ASTRID_MCP_TOKEN" \
            -d "{
              \"taskId\": \"$TASK_ID\",
              \"workflow\": \"fixstuff\",
              \"githubContext\": {
                \"repository\": \"${{ github.repository }}\",
                \"ref\": \"${{ github.ref }}\",
                \"sha\": \"${{ github.sha }}\",
                \"actor\": \"${{ github.actor }}\",
                \"runId\": \"${{ github.run_id }}\",
                \"runUrl\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
              }
            }")

          HTTP_STATUS=$(echo "${RESPONSE}" | tr -d '\n' | sed 's/.*HTTPSTATUS://')
          BODY="${RESPONSE/HTTPSTATUS:${HTTP_STATUS}/}"

          echo "Status: ${HTTP_STATUS}"
          echo "Response: ${BODY}"

          if [ "${HTTP_STATUS}" -eq 200 ] || [ "${HTTP_STATUS}" -eq 201 ]; then
            echo "✅ Coding agent triggered"
          else
            echo "⚠️  Agent trigger returned ${HTTP_STATUS} — check Astrid directly"
          fi

      - name: Run reuse check
        run: npm run check:reuse || echo "⚠️  check:reuse found issues — review before merging"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Fix Task Summary"
            echo "- **Task ID:** \`${{ needs.validate.outputs.task_id }}\`"
            echo "- **Title:** ${{ inputs.task_title }}"
            echo "- **Status:** ${{ job.status }}"
            echo "- **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "> Changes will be on a feature branch. No merge or deploy happens here."
          } >> "${GITHUB_STEP_SUMMARY}"

  deploy-preview:
    name: 'Deploy Preview'
    runs-on: ubuntu-latest
    needs: [validate, fix-task]
    if: ${{ inputs.deploy_preview == true && needs.fix-task.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -f "./scripts/deploy-preview.sh" ]; then
            bash ./scripts/deploy-preview.sh
          else
            echo "deploy-preview.sh not found — skipping"
          fi
