name: 'Unit Tests'

# Every pull request, whatever it changes — NO `paths:` and NO `branches:` here.
#
# The suite used to run only inside preview-deployment.yml, which is filtered
# to the app's own directories. A PR touching only scripts/, tests/ or .github/
# therefore showed every check green without running one unit test: PR #386
# carried a rule test that failed on Linux that way (AWTD-1216).
#
# "Do the tests pass" is not a question about which directories changed.
# tests/rules/unit-tests-run-on-every-pr.test.ts fails if a filter comes back.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: 'Typecheck, Lint & Unit Tests'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # A real Redis for the RealtimeBus conformance suite's node-redis half
    # (tests/integration/realtime-bus-conformance.test.ts, AWTD-1459). Without
    # REALTIME_TEST_REDIS_URL that half is skipped by name, never faked.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Typecheck and lint cover tests/ and scripts/ too, so they belong with
      # the suite rather than behind the preview's path filter.
      - name: Run TypeScript Check
        run: npm run typecheck

      - name: Run Linting
        run: npm run lint

      # Predeploy runs this too; running it here fails the PR instead of the
      # merged main (AWTD-1428).
      - name: Check Documentation Links
        run: npm run check:docs

      # tests/ is outside the app's tsconfig, so `typecheck` never sees it.
      # Predeploy ran this alone, so a fixture missing a new required prop
      # passed CI and failed the gate on the merged main (AWTD-1426).
      - name: Typecheck the Test Tree
        run: npm run typecheck:tests

      # Azure Blob's emulator, so the object-store conformance suite holds the
      # azure-blob driver to the same contract as local (AWTD-1465); without it
      # those cases report skipped, never passed. A step rather than a service
      # container because it needs arguments: @azure/storage-blob speaks a newer
      # API version than Azurite releases have caught up with.
      - name: Start Azurite
        run: |
          docker run -d --name azurite -p 10000:10000 mcr.microsoft.com/azure-storage/azurite:3.37.0 \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:10000/ && break; sleep 1; done

      # SeaweedFS's S3 gateway, for the s3 driver in the same suite (AWTD-1463).
      # With no identities configured it accepts any SigV4 key pair.
      - name: Start SeaweedFS
        run: |
          docker run -d --name seaweedfs -p 8333:8333 chrislusf/seaweedfs:4.51 server -s3 -s3.port=8333
          # Ready before the suite starts, so a slow boot is not a failed contract.
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8333/ && break; sleep 1; done
          curl -sf -o /dev/null http://127.0.0.1:8333/ || { docker logs seaweedfs; exit 1; }

      - name: Run Tests
        run: npm run test:run
        env:
          NODE_ENV: test
          S3_CONFORMANCE_ENDPOINT: http://127.0.0.1:8333
          # Azurite's published development account; not a secret.
          AZURITE_BLOB_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;
          REALTIME_TEST_REDIS_URL: redis://localhost:6379
