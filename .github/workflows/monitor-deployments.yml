name: Monitor Vercel Deployments

on:
  # Run after every push to main (after deployment)
  push:
    branches: [main]

  # Run on schedule to catch any issues
  schedule:
    # Run every hour during business hours (UTC)
    - cron: '0 9-17 * * 1-5'
    # Run every 4 hours outside business hours
    - cron: '0 */4 * * *'

  # Allow manual triggering
  workflow_dispatch:
    inputs:
      apply_fixes:
        description: 'Apply automatic fixes'
        type: boolean
        default: true

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    name: Monitor and Fix Deployment Issues
    # Declared so VERCEL_TOKEN can live in the `production` environment instead
    # of being a repo secret that every workflow in the repo can read, agent
    # branches included (task bd1e0daa). Safe for this job: it runs on
    # `push: main` and on schedule, both of which are `main`, and the
    # environment's branch policy admits only `main` — so a dispatch from any
    # other ref now fails instead of quietly holding a production token. The
    # environment carries no required reviewers, so nothing here waits for an
    # approval.
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Configure Vercel Project
        run: |
          mkdir -p .vercel
          echo '{"projectId":"${{ secrets.VERCEL_PROJECT_ID }}","orgId":"${{ secrets.VERCEL_ORG_ID }}","projectName":"newastrid"}' > .vercel/project.json
          cat .vercel/project.json

      - name: Test Vercel CLI
        run: vercel list --token=${{ secrets.VERCEL_TOKEN }} --yes 2>&1 | head -20
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Monitor deployments
        env:
          APPLY_FIXES: ${{ github.event.inputs.apply_fixes }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [[ "$APPLY_FIXES" == "false" ]]; then
            npm run monitor:vercel:no-fix
          else
            npm run monitor:vercel
          fi

      - name: Upload deployment reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: deployment-reports-${{ github.run_number }}
          path: logs/vercel/
          retention-days: 30

      # There was an "Auto-commit fixes" step here that ran `git add .`, committed
      # and pushed to `main` unreviewed, on every push to main and on an hourly
      # cron. `git add .` commits whatever is in the tree, not a reviewed diff,
      # straight onto the branch production deploys from — the one path by which
      # unread content could reach `main`.
      #
      # It never once fired: `git log --author="GitHub Action"` on main is empty,
      # as is a search for its commit message. So this removes a standing risk
      # and no capability. If auto-fixes are wanted later, they open a PR and go
      # through the gates like anything else.
      #
      # tests/rules/monitor-job-holds-no-write-privileges.test.ts keeps it gone.
