name: Publish @gracefultools/astrid-sdk

on:
  push:
    paths:
      - 'packages/astrid-sdk/src/**'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'none = publish the version in package.json as-is (it must not be on npm yet)'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - patch
          - minor
          - major

jobs:
  publish:
    runs-on: ubuntu-26.04
    # Skip if commit message contains [skip-publish] or is a version bump commit
    if: |
      !contains(github.event.head_commit.message, '[skip-publish]') &&
      !contains(github.event.head_commit.message, 'chore: bump @gracefultools/astrid-sdk')
    permissions:
      contents: write
      # npm trusted publishing (OIDC). The repo has never had an NPM_TOKEN secret,
      # which is why every publish since February failed with ENEEDAUTH
      # (AWTD-1691). Trusted publishing needs no stored token: configure it once
      # at npmjs.com → @gracefultools/astrid-sdk → Settings → Trusted publishing
      # (GitHub Actions, Graceful-Tools/astrid-web, publish-astrid-sdk.yml).
      # An NPM_TOKEN secret, if one is ever added, still works as a fallback.
      id-token: write
    defaults:
      run:
        working-directory: packages/astrid-sdk

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 2  # Need history to check for changes

      - name: Check for source changes
        id: changes
        run: |
          # For manual dispatch, always publish
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if there are actual src/ changes in this commit
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD -- src/ 2>/dev/null || echo "")
          if [ -n "$CHANGED_FILES" ]; then
            echo "Changed files in src/:"
            echo "$CHANGED_FILES"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No source changes detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      - name: Use an npm that supports trusted publishing (11.5.1+)
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          CURRENT_NPM=$(npm --version)
          if node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$CURRENT_NPM"; then
            echo "npm $CURRENT_NPM supports trusted publishing"
          else
            npm install -g npm@^11.5.1
            npm --version
          fi

      - name: Configure git
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        if: steps.changes.outputs.has_changes == 'true'
        run: npm install

      - name: Build
        if: steps.changes.outputs.has_changes == 'true'
        run: npm run build

      - name: Run tests
        if: steps.changes.outputs.has_changes == 'true'
        run: npm test

      # The version in package.json is the one to publish when npm does not have
      # it yet: a deliberate bump (1.0.0 for AWTD-1691's breaking change) ships as
      # written instead of becoming 1.0.1. Only a version npm already has is bumped
      # (patch on push, or the dispatch input).
      - name: Choose the version
        if: steps.changes.outputs.has_changes == 'true'
        env:
          BUMP_TYPE: ${{ github.event.inputs.version_bump || 'auto' }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          CURRENT=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "$NAME@$CURRENT" version 2>/dev/null || true)
          case "$BUMP_TYPE" in
            auto)
              if [ -z "$PUBLISHED" ]; then BUMP="none"; else BUMP="patch"; fi ;;
            none)
              if [ -n "$PUBLISHED" ]; then echo "::error::$NAME@$CURRENT is already on npm; pick patch, minor or major"; exit 1; fi
              BUMP="none" ;;
            patch|minor|major) BUMP="$BUMP_TYPE" ;;
            *) echo "Unsupported version bump: $BUMP_TYPE"; exit 1 ;;
          esac
          if [ "$BUMP" != none ]; then npm version "$BUMP" --no-git-tag-version; fi
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "Publishing $NAME@$NEW_VERSION (package.json had $CURRENT, bump: $BUMP)"
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
          echo "BUMPED=$([ "$BUMP" != none ] && echo true || echo false)" >> "$GITHUB_ENV"

      - name: Publish to npm
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          npm publish --access public || {
            echo "::error::npm publish failed. If the log says ENEEDAUTH or E404, trusted publishing is not configured for this package at npmjs.com (repository Graceful-Tools/astrid-web, workflow publish-astrid-sdk.yml), and there is no NPM_TOKEN secret."
            exit 1
          }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump
        if: steps.changes.outputs.has_changes == 'true' && env.BUMPED == 'true'
        run: |
          cd ../..
          git add packages/astrid-sdk/package.json packages/astrid-sdk/package-lock.json
          git commit -m "chore: bump @gracefultools/astrid-sdk to v${{ env.NEW_VERSION }} [skip-publish]"
          git push

      - name: Create GitHub Release
        if: steps.changes.outputs.has_changes == 'true'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: astrid-sdk-v${{ env.NEW_VERSION }}
          name: "@gracefultools/astrid-sdk v${{ env.NEW_VERSION }}"
          body: |
            ## @gracefultools/astrid-sdk v${{ env.NEW_VERSION }}

            Install or update:
            ```bash
            npm install @gracefultools/astrid-sdk@${{ env.NEW_VERSION }}
            ```

            The agent runner: `astrid-agent queue | claim | release` plus a typed REST client. See the README.
          draft: false
          prerelease: false

      - name: Skip message
        if: steps.changes.outputs.has_changes != 'true'
        run: echo "No source changes detected, skipping publish"
