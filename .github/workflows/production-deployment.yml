name: 'Production Deployment'

on:
  # Production deploys are MANUAL, by design. Trigger from the Actions tab, or run
  # ./scripts/deploy-preview.sh --production.
  #
  # This workflow used to trigger on `push: branches: [main]`, with no path filter, and on
  # `pull_request: types: [closed]`. Both deployed production — and because the deploy job
  # runs `prisma migrate deploy`, both applied pending migrations to production. Merging a
  # branch shipped it, roughly ten minutes later, whether or not anyone intended to deploy.
  #
  # The `closed` trigger was worse than it reads: it fires when a PR is closed whether or
  # not it was merged, and no job checked `github.event.pull_request.merged`, despite a
  # comment claiming it only ran for merged PRs. Closing a PR unmerged deployed production.
  #
  # Do not restore either trigger without deciding that merging should ship.
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (emergency deployment)'
        required: false
        default: false
        type: boolean
      # AWTD-959. Migrations apply in a job that runs BEFORE the deploy and does
      # not depend on it, so a DROP can land while the code that stops reading
      # the dropped thing is still only pending. That happened on 2026-09-18 and
      # took production down: four TaskList columns dropped, the deploy job hung
      # and was cancelled, and the old build 500'd on every list read with no way
      # back — a DROP cannot be undone by redeploying.
      #
      # So a destructive migration needs someone to say, on the record, that the
      # code is already live. Leave this false and the run refuses instead.
      allow_destructive_migrations:
        description: 'Apply a pending DROP / RENAME / SET NOT NULL migration (only when the code that stops using it is ALREADY live)'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '22'
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # Job 1: Quality Gates (Tests, Linting, Build)
  quality-gates:
    name: 'Quality Gates'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ !inputs.skip_tests }}
    outputs:
      quality-passed: ${{ steps.quality-check.outputs.passed }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Check
        run: npm run typecheck

      - name: Check Prisma Schema Drift
        env:
          # Dummy values - not actually connecting to DB, just validating schema matches migrations
          DATABASE_URL: "postgresql://x:x@localhost:5432/x"
          DATABASE_URL_DIRECT: "postgresql://x:x@localhost:5432/x"
        run: |
          echo "Checking if Prisma schema matches migrations..."
          # Compare the schema against the migrations folder (not the live database)
          # This detects if someone added fields to schema.prisma without creating a migration

          # Use prisma format to validate schema, then check migration status
          npx prisma validate

          # Generate a temporary migration to see if there are uncommitted schema changes
          # This doesn't require a database connection
          DIFF=$(npx prisma migrate diff \
            --from-empty \
            --to-schema-datamodel ./prisma/schema.prisma \
            --script 2>&1) || true

          # Get what the migrations folder would produce
          MIGRATION_SQL=""
          for migration in prisma/migrations/*/migration.sql; do
            if [ -f "$migration" ]; then
              MIGRATION_SQL="$MIGRATION_SQL$(cat "$migration")\n"
            fi
          done

          # Check if schema.prisma defines tables/columns not in any migration file
          # We look for CREATE TABLE statements in the diff that aren't in migrations
          # Note: prisma migrate diff outputs "CREATE TABLE "TableName"" but migrations may use
          # "CREATE TABLE "public"."TableName"" (schema-qualified), so we extract just the table name
          SCHEMA_TABLES=$(echo "$DIFF" | grep -oE 'CREATE TABLE "[^"]+"' | sed 's/CREATE TABLE "//' | sed 's/"$//' | sort -u || true)

          MISSING_TABLES=""
          while IFS= read -r table_name; do
            # Skip empty lines
            if [ -z "$table_name" ]; then
              continue
            fi
            # Allow idempotent migrations and an optional schema prefix.
            if ! grep -qE "CREATE TABLE (IF NOT EXISTS )?(\"public\"\\.)?\"${table_name}\"" prisma/migrations/*/migration.sql 2>/dev/null; then
              MISSING_TABLES="${MISSING_TABLES}CREATE TABLE \"${table_name}\"\n"
            fi
          done <<< "$SCHEMA_TABLES"

          if [ -n "$MISSING_TABLES" ]; then
            echo ""
            echo "❌ ERROR: Prisma schema has changes that are not in migrations!"
            echo ""
            echo "Missing from migrations:"
            echo -e "$MISSING_TABLES"
            echo ""
            echo "To fix this, run locally:"
            echo "  npx prisma migrate dev --name <describe_your_change>"
            echo ""
            echo "Then commit the new migration file in prisma/migrations/"
            exit 1
          fi
          echo "✅ Prisma schema matches migrations"

      - name: Check API/iOS Model Sync
        # astrid-ios is public, so the default repo-scoped GITHUB_TOKEN can read
        # it — no PAT needed. ASTRID_IOS_GITHUB_TOKEN (if ever set as a secret)
        # takes precedence. --strict: an unverified check FAILS the step; this
        # gate ran as a silent no-op rendered as a pass for weeks (task 1985804a).
        env:
          ASTRID_IOS_GITHUB_TOKEN: ${{ secrets.ASTRID_IOS_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking if Prisma, Swift, and Core Data models are in sync..."
          npm run check:model-sync -- --strict

      - name: Check for API Breaking Changes
        run: |
          echo "Checking for API breaking changes..."
          npm run check:api-breaking

      - name: Run Linting
        run: npm run lint

      - name: Run Tests
        run: npm test
        env:
          NODE_ENV: test

      - name: Build Application
        run: npm run build
        env:
          NODE_ENV: production
          # Use production database for builds
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Set Quality Check Status
        id: quality-check
        run: |
          echo "passed=true" >> $GITHUB_OUTPUT
          echo "✅ All quality gates passed"

  # Job 2: Database Migration (Production)
  database-migration:
    name: 'Database Migration'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality-gates
    if: always() && (needs.quality-gates.outputs.quality-passed == 'true' || inputs.skip_tests)
    outputs:
      migration-success: ${{ steps.migration.outputs.success }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Clear Stale Migration Locks
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
        run: |
          echo "Clearing any stale advisory locks from previous failed migrations..."
          # Prisma uses advisory lock 72707369 for migrations
          # Release it if stuck from a previous failed run
          npx prisma db execute --stdin <<< "SELECT pg_advisory_unlock(72707369);" || true
          echo "✅ Lock cleanup complete"

      - name: Resolve Failed Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
        run: |
          echo "Checking for failed migrations..."

          # Find failed migrations by looking at the _prisma_migrations table
          # These are migrations that started but didn't finish (no finished_at and not rolled back)
          FAILED_MIGRATIONS=$(npx prisma db execute --stdin <<< "SELECT migration_name FROM _prisma_migrations WHERE finished_at IS NULL AND rolled_back_at IS NULL ORDER BY started_at;" 2>&1) || true

          # Extract just the migration names (skip header/footer lines)
          MIGRATION_NAMES=$(echo "$FAILED_MIGRATIONS" | grep -E "^[0-9]{8}" || true)

          if [ -z "$MIGRATION_NAMES" ]; then
            echo "✅ No failed migrations found"
            exit 0
          fi

          echo "Found failed migrations:"
          echo "$MIGRATION_NAMES"
          echo ""

          # For each failed migration, check if its artifacts exist in the database
          # If they do, mark as applied (safe). If not, mark as rolled-back (retry).
          while IFS= read -r migration; do
            if [ -z "$migration" ]; then
              continue
            fi

            echo "Processing failed migration: $migration"

            # Find the migration file and extract table names it creates
            MIGRATION_FILE="prisma/migrations/${migration}/migration.sql"
            if [ ! -f "$MIGRATION_FILE" ]; then
              echo "  ⚠️ Migration file not found, marking as rolled-back"
              npx prisma migrate resolve --rolled-back "$migration" || true
              continue
            fi

            # Extract CREATE TABLE statements to find tables this migration creates
            TABLES_CREATED=$(grep -oE 'CREATE TABLE "[^"]+"' "$MIGRATION_FILE" | sed 's/CREATE TABLE "//' | sed 's/"$//' || true)

            if [ -z "$TABLES_CREATED" ]; then
              # No tables created - might be an ALTER or INDEX migration
              # Check if it's adding columns
              COLUMNS_ADDED=$(grep -oE 'ADD COLUMN "[^"]+"' "$MIGRATION_FILE" || true)
              if [ -n "$COLUMNS_ADDED" ]; then
                echo "  Migration adds columns, marking as applied (safe default)"
                npx prisma migrate resolve --applied "$migration" || true
              else
                echo "  No CREATE TABLE found, marking as applied (safe default)"
                npx prisma migrate resolve --applied "$migration" || true
              fi
              continue
            fi

            # Check if any of the tables exist
            TABLES_EXIST=false
            for table in $TABLES_CREATED; do
              TABLE_CHECK=$(npx prisma db execute --stdin <<< "SELECT EXISTS (SELECT FROM information_schema.tables WHERE table_schema = 'public' AND table_name = '${table}');" 2>&1) || true
              if echo "$TABLE_CHECK" | grep -q "t"; then
                TABLES_EXIST=true
                echo "  Table '${table}' exists in database"
                break
              fi
            done

            if [ "$TABLES_EXIST" = true ]; then
              echo "  ✅ Migration artifacts exist, marking as applied"
              npx prisma migrate resolve --applied "$migration"
            else
              echo "  ⚠️ Migration artifacts don't exist, marking as rolled-back for retry"
              npx prisma migrate resolve --rolled-back "$migration"
            fi

          done <<< "$MIGRATION_NAMES"

          echo "✅ Failed migrations resolved"

      # AWTD-959. The gate that was missing on 2026-09-18. It runs here — after
      # failed migrations are resolved, so `prisma migrate status` gives a clean
      # answer, and before anything is applied — and refuses a pending DROP,
      # RENAME or SET NOT NULL unless the dispatch input says the matching code
      # is already live. The detector is unit-tested in
      # tests/scripts/destructive-migrations.test.ts; a rule embedded in YAML is
      # a rule nobody can run a test against.
      - name: Guard Destructive Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          ALLOW_DESTRUCTIVE_MIGRATIONS: ${{ inputs.allow_destructive_migrations }}
        run: npx tsx scripts/check-destructive-migrations.ts

      - name: Run Database Migrations
        id: migration
        env:
          # DATABASE_URL = pooler URL for runtime queries
          # DATABASE_URL_DIRECT = direct connection for migrations (required for advisory locks)
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
        run: |
          echo "Running database migrations..."
          npx prisma migrate deploy
          echo "success=true" >> $GITHUB_OUTPUT
          echo "✅ Database migrations completed successfully"

      - name: Generate Prisma Client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
        run: |
          echo "Generating Prisma client..."
          npx prisma generate

  # Job 3: Deploy to Vercel Production
  deploy-production:
    name: 'Deploy to Production'
    runs-on: ubuntu-latest
    # 30, not 20 — but the number matters far less now than it did. Every slow
    # thing inside is separately bounded (600s for the CLI, 300s to verify the
    # SHA), so this is the backstop rather than the thing that decides the
    # outcome. At 20 it WAS the thing that decided the outcome: the CLI hung, the
    # runner cancelled the job, and the log said only "The operation was
    # canceled" about a deploy that had succeeded (AWTD-959).
    timeout-minutes: 30
    needs: [quality-gates, database-migration]
    if: always() && (needs.quality-gates.outputs.quality-passed == 'true' || inputs.skip_tests) && needs.database-migration.outputs.migration-success == 'true'
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
      deployment-success: ${{ steps.deploy.outputs.success }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build Project Artifacts
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token=$VERCEL_TOKEN

      # AWTD-959. This step used to report FAILED about deploys that succeeded.
      # Three separate causes, all fixed here:
      #
      #   1. IT WAS INVISIBLE. `DEPLOYMENT_OUTPUT=$(vercel deploy ... 2>&1)`
      #      captures every byte of progress into a variable that is only echoed
      #      AFTER the command returns. A successful run dumped 40 lines at once;
      #      a hung run printed nothing at all. The log read:
      #        20:39:34  Deploying to production...
      #        20:57:43  ##[error]The operation was canceled.
      #      So it streams through tee now, and `set -o pipefail` keeps the
      #      pipeline's status the CLI's rather than tee's (always 0).
      #
      #   2. IT HAD NO TIMEOUT. `vercel deploy` blocks until the deployment is
      #      READY and carries no timeout of its own, so it ate the job's entire
      #      budget and the RUNNER cancelled it — an `##[error]` with no
      #      diagnosis. The CLI now gets a bounded 600s, well inside the job's,
      #      so this step reports first and says what happened.
      #
      #   3. IT GUESSED. Success meant "a URL could be regexed out of stdout".
      #      Production can just be asked: /api/health reports
      #      VERCEL_GIT_COMMIT_SHA as `commitSha`. During the incident it
      #      answered 25712912 — the SHA of the deploy this job called a failure.
      #      A CLI that times out is not the same thing as a deploy that failed,
      #      and only production knows which happened.
      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -o pipefail

          # What is live BEFORE we touch anything. Without this, verifying the SHA
          # afterwards cannot tell "this run deployed it" from "it was already
          # there" — and re-running a deploy of the SAME commit is exactly what
          # happened on 2026-09-18. Reporting success in that case is right (the
          # intended code IS live), but it must not be mistaken for proof that
          # this run's CLI worked, so the log says which one it was.
          sha_before=$(curl -sS --max-time 15 https://astrid.cc/api/health 2>/dev/null \
            | grep -oE '"commitSha"[[:space:]]*:[[:space:]]*"[^"]*"' \
            | sed -E 's/.*"([^"]*)".*/\1/' || true)
          echo "ℹ️  Production is currently serving: ${sha_before:-(no answer)}"
          echo "ℹ️  This run is deploying:           $GITHUB_SHA"

          echo "Deploying to production..."

          deploy_status=0
          timeout 600 vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" 2>&1 \
            | tee /tmp/vercel-deploy.log || deploy_status=$?

          if [ "$deploy_status" -eq 124 ]; then
            echo "⏱️  vercel deploy did not return within 600s."
            echo "   It may still have deployed — asking production rather than assuming."
          elif [ "$deploy_status" -ne 0 ]; then
            echo "⚠️  vercel deploy exited $deploy_status."
            echo "   Asking production what is actually live before calling this a failure."
          fi

          # The tested extractor, not a second inline regex. It handles the
          # cursor-control escapes and the Inspect-URL trap that the inline
          # version missed (scripts/extract-preview-url.sh, PR #206).
          DEPLOYMENT_URL=$(bash scripts/extract-preview-url.sh < /tmp/vercel-deploy.log || true)
          if [ -n "$DEPLOYMENT_URL" ]; then
            echo "deployment-url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
            echo "🔗 Deployment URL: $DEPLOYMENT_URL"
          else
            echo "ℹ️  No deployment URL in the output. Not a verdict on its own."
          fi

          # THE ONLY THING THAT DECIDES SUCCESS: what production is serving.
          if bash scripts/verify-deployed-sha.sh "$GITHUB_SHA" --timeout 300; then
            echo "success=true" >> $GITHUB_OUTPUT
            echo "✅ Production is serving $GITHUB_SHA."
            if [ "$sha_before" = "$GITHUB_SHA" ]; then
              echo "⚠️  It was ALREADY serving this commit before this run started."
              echo "   The intended code is live, so this is a pass — but this run"
              echo "   has NOT shown that the deploy step itself works. If you are"
              echo "   here to test the pipeline, deploy a different commit."
            fi
            exit 0
          fi

          echo "success=false" >> $GITHUB_OUTPUT
          echo "❌ Production is NOT serving $GITHUB_SHA — this is a real deploy failure."
          exit 1

  # Job 4: Post-Deployment Health Check
  health-check:
    name: 'Health Check'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: deploy-production
    # AWTD-959. This was `needs.deploy-production.outputs.deployment-success ==
    # 'true'`, so on 2026-09-18 — the one run where production was actually
    # broken — the only automated verification was skipped. A deploy job that
    # reports failure is exactly when someone needs to know what production is
    # serving, so this now runs whenever the deploy was ATTEMPTED and fails on
    # its own findings rather than inheriting the deploy job's verdict.
    if: always() && needs.deploy-production.result != 'skipped'
    steps:
      # Needed for scripts/verify-deployed-sha.sh. This job had no checkout,
      # which is the same omission that made the removed Job 5 dead code.
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify Production Is Serving This Commit
        run: |
          # Replaces a loop that curled the home page for a 200. That was never
          # evidence the deploy landed: throughout the 2026-09-18 outage
          # astrid.cc returned 200 while every list read 500'd, because the old
          # build was live against the new schema. A commit SHA is the question
          # worth asking.
          bash scripts/verify-deployed-sha.sh "$GITHUB_SHA" --timeout 300

      - name: Run Health Checks
        run: |
          PROD_URL="https://astrid.cc"
          echo "Running health checks against: $PROD_URL"

          # Test home page (follows redirects to /auth/signin for unauthenticated users)
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L --max-redirs 3 "$PROD_URL")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Home page health check passed (status: $HTTP_STATUS)"
          else
            echo "❌ Home page health check failed with status: $HTTP_STATUS"
            exit 1
          fi

          # Test API health endpoint
          HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_URL/api/health" || echo "404")
          if [ "$HEALTH_STATUS" = "200" ]; then
            echo "✅ API health check passed"
          else
            echo "ℹ️ API health endpoint returned: $HEALTH_STATUS"
          fi

          echo "🎯 Production health checks passed!"

  # Job 5 (Update AI Agent Tasks) was REMOVED — AWTD-868.
  #
  # Its only real step POSTed to /api/coding-agent/deployment-complete, a route
  # that has never existed: `git log -S deployment-complete -- app/` finds it in
  # no commit, ever. It was wired up from this end only.
  #
  # It could not have run in any case. The job had NO checkout step, so its
  # gating step — `git diff --name-only HEAD~1..HEAD` — had no work tree, and the
  # `ai_changes` output it produced was never true. Since #204 made this workflow
  # workflow_dispatch-only, HEAD~1..HEAD would not have meant anything either.
  #
  # And the `|| echo "Warning: Could not notify..."` could never fire: `curl -s`
  # exits 0 on a 404, because an HTTP error is not a curl failure without --fail.
  # It read as error handling and was guaranteed dead code, which is how this
  # survived. Any curl added here must check its STATUS, as the health checks
  # above already do.
  #
  # Notifying a task when a deploy finishes is still worth having. It needs an
  # endpoint built first, which is filed rather than faked here.

  # Job 6: Deployment Summary
  deployment-summary:
    name: 'Deployment Summary'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [quality-gates, database-migration, deploy-production, health-check]
    if: always()
    steps:
      - name: Generate Deployment Summary
        env:
          DEPLOYMENT_URL: ${{ needs.deploy-production.outputs.deployment-url }}
          QUALITY_RESULT: ${{ needs.quality-gates.result }}
          MIGRATION_RESULT: ${{ needs.database-migration.result }}
          DEPLOYMENT_RESULT: ${{ needs.deploy-production.result }}
          HEALTH_RESULT: ${{ needs.health-check.result }}
          DEPLOYMENT_SUCCESS: ${{ needs.deploy-production.outputs.deployment-success }}
          DEPLOY_ENVIRONMENT: ${{ inputs.deploy_environment || 'production' }}
        run: |
          echo "## 🚀 Production Deployment Summary"
          echo ""
          if [ "$DEPLOYMENT_SUCCESS" = "true" ]; then
            echo "**Deployment Status:** ✅ SUCCESS"
          else
            echo "**Deployment Status:** ❌ FAILED"
          fi
          echo "**Environment:** $DEPLOY_ENVIRONMENT"
          echo "**Branch:** $GITHUB_REF_NAME"
          echo "**Commit:** $GITHUB_SHA"
          echo ""
          echo "### Job Results"
          echo "- **Quality Gates:** ${{ needs.quality-gates.result == 'success' && '✅ Passed' || needs.quality-gates.result == 'skipped' && 'ℹ️ Skipped' || '❌ Failed' }}"
          echo "- **Database Migration:** ${{ needs.database-migration.result == 'success' && '✅ Success' || '❌ Failed' }}"
          echo "- **Production Deployment:** ${{ needs.deploy-production.result == 'success' && '✅ Success' || '❌ Failed' }}"
          echo "- **Health Checks:** ${{ needs.health-check.result == 'success' && '✅ Passed' || '❌ Failed' }}"
          echo ""

          if [ -n "$DEPLOYMENT_URL" ]; then
            echo "**🌐 Production URL:** $DEPLOYMENT_URL"
            echo ""
          fi

          if [ "${{ needs.deploy-production.outputs.deployment-success }}" = "true" ]; then
            echo "### 🎉 Deployment Successful!"
            echo "Your application has been successfully deployed to production."
            echo ""
            echo "**Post-Deployment:**"
            echo "- All services are healthy and responding"
            echo "- Database migrations completed successfully"
            echo "- AI agent workflows (if any) have been notified"
          else
            echo "### ❌ Deployment Failed"
            echo "Please check the job logs for details and retry the deployment."
          fi

          echo ""
          echo "**GitHub Actions Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"