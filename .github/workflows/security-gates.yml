name: Security Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  dependency-audit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Runtime packages ship with the app. New vulnerable dev dependencies are
      # still blocked by dependency-review above; Prisma's CLI dependency tree
      # currently carries a high advisory that is not present at runtime.
      #
      # The same gate predeploy runs (scripts/audit-production-advisories.ts): the
      # question bare npm audit (high and above, runtime tree only) asks, of the same
      # registry, plus the advisories accepted on the record (ACCEPTED_ADVISORIES,
      # each with a reason and a review date, ADEV-84). Bare `npm audit` could not
      # read that list, so the two gates disagreed. It exits 3 when it cannot prove
      # its answer, which fails the job too.
      - run: npm run audit:prod

  secret-scan:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc # v3.99.9
        with:
          extra_args: --only-verified
          version: 3.97.1

  workflow-configuration:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          annotations: true
          min-severity: high
          min-confidence: high
