name: Security Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate

  # ADEV-339: no package version is installed unless Socket has analyzed it and reports no
  # blocking risk. Runs on the lockfile diff BEFORE anything is installed: the gate is plain
  # Node with no dependencies. It fails closed, so a PR that adds packages is red until
  # SOCKET_API_TOKEN and SOCKET_ORG_SLUG exist (Actions secrets, and Dependabot secrets for
  # Dependabot's PRs). A PR that adds none makes no request and passes.
  socket-package-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check new package versions with Socket
        env:
          SOCKET_API_TOKEN: ${{ secrets.SOCKET_API_TOKEN }}
          SOCKET_ORG_SLUG: ${{ secrets.SOCKET_ORG_SLUG }}
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/deps-gate.mjs check --base "origin/${BASE_REF}"

  dependency-audit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Runtime packages ship with the app. New vulnerable dev dependencies are
      # still blocked by dependency-review above; Prisma's CLI dependency tree
      # currently carries a high advisory that is not present at runtime.
      #
      # The same gate predeploy runs (scripts/audit-production-advisories.ts): the
      # question bare npm audit (high and above, runtime tree only) asks, of the same
      # registry, plus the advisories accepted on the record (ACCEPTED_ADVISORIES,
      # each with a reason and a review date, ADEV-84). Bare `npm audit` could not
      # read that list, so the two gates disagreed. It exits 3 when it cannot prove
      # its answer, which fails the job too.
      - run: npm run audit:prod

  secret-scan:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@4ef51f69ca6347aaa76a5e64a87eac9c0c909f71 # v3.100.1
        with:
          extra_args: --only-verified
          version: 3.97.1

  workflow-configuration:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          annotations: true
          min-severity: high
          min-confidence: high
