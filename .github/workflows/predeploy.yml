name: 'Predeploy Checks'

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Check mode'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - standard
          - quick
          - simple

jobs:
  predeploy:
    name: 'Run Predeploy Checks'
    runs-on: [self-hosted, astrid-web]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run predeploy (standard)
        if: ${{ inputs.mode == 'standard' }}
        run: npm run predeploy

      - name: Run predeploy (quick — TS + lint only)
        if: ${{ inputs.mode == 'quick' }}
        run: npm run predeploy:quick

      - name: Run predeploy (full — includes Playwright E2E)
        if: ${{ inputs.mode == 'full' }}
        run: npm run predeploy:full

      - name: Run predeploy (simple — no auto-fix)
        if: ${{ inputs.mode == 'simple' }}
        run: npm run predeploy:simple

      - name: Summary
        if: always()
        run: |
          echo "## Predeploy Results"
          echo "Mode: ${{ inputs.mode }}"
          echo "Status: ${{ job.status }}"
