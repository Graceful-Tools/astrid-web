name: 'Predeploy Checks'

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Check mode'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - standard
          - quick
          - simple

jobs:
  predeploy:
    name: 'Run Predeploy Checks'
    # The Mac's astrid-web runner was retired with the Mac web loop (AWTD-1363).
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # .nvmrc is the one declared version (AWTD-1382). It must stay >= 22: the
          # contract fixture exporter runs the TypeScript directly (AWTD-1031).
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run predeploy (standard)
        if: ${{ inputs.mode == 'standard' }}
        run: npm run predeploy

      - name: Run predeploy (quick — TS + lint only)
        if: ${{ inputs.mode == 'quick' }}
        run: npm run predeploy:quick

      - name: Run predeploy (full — includes Playwright E2E)
        if: ${{ inputs.mode == 'full' }}
        run: npm run predeploy:full

      - name: Run predeploy (simple — no auto-fix)
        if: ${{ inputs.mode == 'simple' }}
        run: npm run predeploy:simple

      - name: Summary
        if: always()
        run: |
          echo "## Predeploy Results"
          echo "Mode: ${{ inputs.mode }}"
          echo "Status: ${{ job.status }}"
